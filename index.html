<section class="soft-section"><div class="soft-inner"><div class="section-head"><div class="section-pill"><h2>الباقات</h2></div><h2 class="big-title">وفر أكثر مع الباقات</h2><p class="soft-copy">اشتر أكثر من لعبة واحصل على أفضل سعر.</p></div><div class="packages"><div class="package"><h3>باقة الجمعات</h3><p>مجموعة ألعاب متنوعة مناسبة للجلسات العائلية والأصدقاء.</p><div class="price">وفر أكثر</div></div><div class="package"><h3>باقة التحديات</h3><p>اختيارات سريعة للحماس والمنافسة بدون تحميل تطبيقات.</p><div class="price">عدة ألعاب</div></div></div><div class="features"><div class="feature"><div class="feature-icon">⚡</div><h3>تشغيل مباشر</h3><p>افتح اللعبة من المتصفح وابدأ اللعب.</p></div><div class="feature"><div class="feature-icon">📱</div><h3>للجوال والشاشة</h3><p>صممت لتناسب الجلسات وأجهزة العرض.</p></div><div class="feature"><div class="feature-icon">🎉</div><h3>للجمعات</h3><p>ألعاب عربية خفيفة وممتعة للعائلة والأصدقاء.</p></div></div></div></section>
<section class="faq"><h2>الأسئلة الشائعة</h2>${[['كيف أبدأ ألعب الألعاب؟','اختر اللعبة من القائمة، افتح صفحتها ثم اضغط تشغيل اللعبة.'],['هل أحتاج تحميل تطبيق؟','لا، الألعاب تعمل مباشرة من المتصفح.'],['هل أستطيع عرض اللعبة على التلفزيون؟','نعم، يمكنك فتح الموقع على شاشة كبيرة أو مشاركة شاشة جهازك.'],['كم عدد اللاعبين؟','يختلف حسب اللعبة، وستجد العدد المناسب داخل بطاقة وصفحة كل لعبة.']].map(([q,a])=>`<div class="faq-item"><button class="faq-q">${q}<span>⌄</span></button><div class="faq-a">${a}</div></div>`).join('')}</section>
<footer class="footer"><strong>ألعاب زامن</strong><p>ألعاب جماعية عربية تعمل من المتصفح.</p></footer>`;
bindHome();}
function detail(slug){const g=games.find(x=>x.slug===slug);if(!g) return home();document.title=g.name+' | ألعاب زامن';const shots=(g.shots||[]).map((s,i)=>`<img src="${s}" alt="لقطة ${i+1} من ${esc(g.name)}" loading="lazy" decoding="async">`).join('');app.innerHTML=`<div class="detail"><a class="back" href="/">← الرئيسية</a><div class="detail-hero"><img class="detail-img" src="${g.image}" alt="${esc(g.name)}"><div><span class="rating">⭐ 5.0</span><h1>${esc(g.name)}</h1><p class="detail-desc">${esc(g.desc)}</p><div class="tags">${g.players?`<span class="tag">${esc(g.players)}</span>`:''}${g.questions?`<span class="tag">${esc(g.questions)}</span>`:''}${g.badge?`<span class="tag">${esc(g.badge)}</span>`:''}<span class="tag">${esc(g.price)}</span></div><div class="actions"><a class="primary" href="${g.play}" target="_blank" rel="noopener">تشغيل اللعبة</a><a class="secondary" href="${g.buy}" target="_blank" rel="noopener">شراء اللعبة</a></div></div></div>${shots?`<div class="section-head" style="margin-top:46px"><div class="section-pill"><h2>صور من الداخل</h2></div></div><div class="shots">${shots}</div>`:''}</div>`;}
function bindHome(){const search=document.getElementById('search');if(search) search.oninput=e=>{const q=e.target.value.trim().toLowerCase();let count=0;document.querySelectorAll('.game-card').forEach(card=>{const show=!q||card.textContent.toLowerCase().includes(q);card.classList.toggle('hidden',!show);if(show)count++});document.querySelectorAll('.category').forEach(sec=>{sec.classList.toggle('hidden',![...sec.querySelectorAll('.game-card')].some(c=>!c.classList.contains('hidden')))});document.getElementById('noResults').classList.toggle('hidden',count>0)};document.querySelectorAll('.faq-q').forEach(b=>b.onclick=()=>b.parentElement.classList.toggle('open'));}
const path=location.pathname;const m=path.match(/^\/game\/([^/]+)\/?$/);m?detail(decodeURIComponent(m[1])):home();
</script>
</body></html>
