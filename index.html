<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>من أنا؟ — البداية</title>
<style>
:root{
  --navy:#18384c;
  --bg:#f3f8e5;
  --dot:#d8e7c6;
  --panel:#eaf8d2;
  --green:#57cd78;
  --shadow:#a9b89b;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Tahoma,"Segoe UI",Arial,sans-serif;color:var(--navy)}
body{
  background-color:var(--bg);
  background-image:radial-gradient(circle,var(--dot) 2px,transparent 2.2px);
  background-size:16px 16px;
}
.wrap{
  width:min(560px,94vw);
  margin:0 auto;
  padding:clamp(28px,5vh,54px) 0 42px;
}
.logo{
  text-align:center;
  font-size:clamp(58px,7vw,82px);
  line-height:.88;
  font-weight:1000;
  letter-spacing:-3px;
  margin-bottom:5px;
}
.sub{
  text-align:center;
  color:#5b715e;
  font-size:15px;
  margin-bottom:32px;
}
.card{
  background:rgba(234,248,210,.97);
  border:3px solid var(--navy);
  border-radius:18px;
  box-shadow:0 7px 0 var(--shadow);
  padding:22px 24px;
  margin-bottom:22px;
}
.card h2{
  font-size:22px;
  margin:0 0 20px;
}
.field{margin-bottom:18px}
.field:last-child{margin-bottom:0}
label{
  display:block;
  font-weight:900;
  margin-bottom:8px;
}
input{
  width:100%;
  background:#fffefa;
  border:3px solid var(--navy);
  border-radius:12px;
  box-shadow:0 4px 0 #aab6a3;
  padding:14px 16px;
  color:var(--navy);
  font-weight:800;
  outline:none;
  font-size:17px;
}
.timers{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}
.start{
  width:100%;
  background:var(--green);
  color:var(--navy);
  border:3px solid var(--navy);
  border-radius:18px;
  box-shadow:0 7px 0 #2f8550;
  padding:17px 20px;
  font-weight:1000;
  font-size:22px;
  cursor:pointer;
}
.start:active{
  transform:translateY(3px);
  box-shadow:0 4px 0 #2f8550;
}
.status{
  text-align:center;
  margin-top:13px;
  font-size:13px;
  color:#607267;
}
@media(max-width:560px){
  .wrap{width:92vw}
  .card{padding:18px}
  .timers{grid-template-columns:1fr}
  .logo{font-size:58px}
}
</style>
</head>
<body>
<main class="wrap">
  <div class="logo">من أنا؟</div>
  <div class="sub">لعبة المسابقة التفاعلية</div>

  <section class="card">
    <h2>• أسماء الفرق (فريقين فقط)</h2>

    <div class="field">
      <label>● الفريق الأول</label>
      <input id="team1" value="الفريق الأول" autocomplete="off">
    </div>

    <div class="field">
      <label>○ الفريق الثاني</label>
      <input id="team2" value="الفريق الثاني" autocomplete="off">
    </div>
  </section>

  <section class="card">
    <h2>• إعدادات مؤقت الجرس</h2>

    <div class="timers">
      <div class="field">
        <label>مؤقت الضغطة الأولى (بالثواني)</label>
        <input id="firstTimer" type="number" min="1" value="5">
      </div>

      <div class="field">
        <label>مؤقت الفريق الآخر (بالثواني)</label>
        <input id="secondTimer" type="number" min="1" value="10">
      </div>
    </div>
  </section>

  <button id="startBtn" class="start">ابدأ الجولة!</button>
  <div id="status" class="status">جاري الاتصال…</div>
</main>

<script src="./firebase-config.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getDatabase, ref, get, set, update, onValue } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

const app = initializeApp(window.firebaseConfig);
const db = getDatabase(app);
const gameRef = ref(db, "mn_ana");

const t1 = document.getElementById("team1");
const t2 = document.getElementById("team2");
const firstTimer = document.getElementById("firstTimer");
const secondTimer = document.getElementById("secondTimer");
const status = document.getElementById("status");

onValue(gameRef, snap => {
  status.textContent = "متصل";
  if(!snap.exists()) return;
  const s = snap.val();
  const a = s.teams?.[1] || s.teams?.["1"];
  const b = s.teams?.[2] || s.teams?.["2"];
  if(a?.name && document.activeElement !== t1) t1.value = a.name;
  if(b?.name && document.activeElement !== t2) t2.value = b.name;
  if(s.settings?.firstTimer && document.activeElement !== firstTimer) firstTimer.value = s.settings.firstTimer;
  if(s.settings?.secondTimer && document.activeElement !== secondTimer) secondTimer.value = s.settings.secondTimer;
}, () => {
  status.textContent = "تعذر الاتصال بـ Firebase";
});

document.getElementById("startBtn").addEventListener("click", async () => {
  const team1Name = t1.value.trim() || "الفريق الأول";
  const team2Name = t2.value.trim() || "الفريق الثاني";
  const ft = Math.max(1, Number(firstTimer.value || 5));
  const st = Math.max(1, Number(secondTimer.value || 10));

  status.textContent = "جاري بدء اللعبة…";

  const snap = await get(gameRef);
  const old = snap.exists() ? snap.val() : {};
  const old1 = old.teams?.[1] || old.teams?.["1"] || {};
  const old2 = old.teams?.[2] || old.teams?.["2"] || {};

  await set(gameRef, {
    teams: {
      1: { name: team1Name, score: 0, x2Used: false, x2Active: false },
      2: { name: team2Name, score: 0, x2Used: false, x2Active: false }
    },
    settings: {
      firstTimer: ft,
      secondTimer: st
    },
    round: 1,
    qIndex: -1,
    question: {
      text: "بانتظار المقدم لبدء السؤال.",
      answer: "",
      choices: []
    },
    buzzer: {
      open: false,
      winner: null,
      pressedAt: null
    }
  });

  window.location.href = "./game.html";
});
</script>
</body>
</html>
