<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>شاشة المقدم | حروف</title>
<style>
@font-face{font-family:system-ui;src:local("Arial")}
*{box-sizing:border-box}
:root{--purple:#5b2d8e;--purple2:#7a49a6;--pink:#ef3f98;--blue:#3c84ee;--cream:#fff;--muted:#c9b5da}
body{
 margin:0;background:#5b2d8e;color:#fff;font-family:Tahoma,Arial,sans-serif;
 min-height:100vh;
}
.shell{width:min(1180px,96vw);margin:0 auto;padding:18px 0 36px}
.top{
 display:flex;align-items:center;justify-content:space-between;gap:16px;
 background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);
 border-radius:26px;padding:14px 22px;margin-bottom:18px;
}
.logo{display:flex;align-items:center;gap:14px}
.logo-mark{font-size:34px;font-weight:1000;color:#ffd329;text-shadow:0 5px 0 rgba(0,0,0,.18)}
.logo-sub{font-size:18px;font-weight:900;color:#ff675b}
.title{font-size:30px;font-weight:1000;color:#ffd329}
.session{font-size:13px;color:#e7d9f1;direction:ltr}
.layout{display:grid;grid-template-columns:minmax(420px,1.2fr) minmax(340px,.9fr);gap:20px;align-items:start}
.board-card{
 background:linear-gradient(145deg,var(--pink) 0 12%,var(--blue) 12% 88%,var(--pink) 88%);
 border-radius:24px;padding:26px;box-shadow:0 18px 34px rgba(0,0,0,.22);
}
.hex-grid{display:flex;flex-direction:column;align-items:center;gap:0;padding:8px 0}
.hex-row{display:flex;justify-content:center;margin-top:-10px}
.hex{
 width:94px;height:84px;margin:0 -2px;display:grid;place-items:center;
 background:#fff;color:var(--purple);font-size:33px;font-weight:1000;
 clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%);
 border:0;cursor:pointer;position:relative;
 filter:drop-shadow(0 0 0 #5b2d8e);
 transition:.14s ease;
}
.hex::after{
 content:"";position:absolute;inset:3px;clip-path:inherit;border:4px solid var(--purple);pointer-events:none;
}
.hex.selected{background:#ffd54f}
.hex.c1{background:var(--c1,#e43b41);color:transparent}
.hex.c2{background:var(--c2,#0056b3);color:transparent}
.hex:hover{transform:scale(1.04);z-index:3}
.panel{
 background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);
 border-radius:26px;overflow:hidden;box-shadow:0 18px 34px rgba(0,0,0,.15)
}
.panel-head{
 background:linear-gradient(90deg,#9b5cf0,#e43f9c);padding:16px 20px;
 display:flex;justify-content:space-between;align-items:center;font-weight:1000
}
.qbox{padding:22px}
.letter{font-size:14px;color:#eadcf4;text-align:center;margin-bottom:10px}
.question{font-size:25px;line-height:1.7;font-weight:1000;text-align:center;min-height:120px;display:grid;place-items:center}
.hint{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.15);padding:12px;border-radius:15px;text-align:center;color:#eadcf4;font-size:13px;margin-bottom:16px}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.team{
 min-height:88px;border:1px solid rgba(255,255,255,.13);border-radius:18px;padding:12px;
 display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;
 background:rgba(255,255,255,.08)
}
.team b{font-size:16px}.score{font-size:28px;font-weight:1000}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.btn{
 min-height:58px;border:0;border-radius:16px;font-family:inherit;font-size:16px;font-weight:1000;
 cursor:pointer;color:#fff;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.12)
}
.btn.gold{background:#c39179;color:#39204f}
.btn.c1{background:var(--c1,#e43b41)}
.btn.c2{background:var(--c2,#0056b3)}
.btn.wide{grid-column:1/-1}
.btn:disabled{opacity:.45;cursor:not-allowed}
.fast{
 margin-top:14px;background:#ffd54f;color:#51217b;border-radius:14px;padding:11px 14px;
 text-align:center;font-weight:1000;display:none
}
.status{font-size:12px;color:#e4d3ef;text-align:center;margin-top:12px}
@media(max-width:900px){
 .layout{grid-template-columns:1fr}.board-card{padding:14px}.hex{width:70px;height:64px;font-size:25px}
}
@media(max-width:520px){
 .shell{width:100%;padding:8px}.top{border-radius:18px}.title{font-size:21px}
 .hex{width:58px;height:54px;font-size:21px}.board-card{padding:9px}.question{font-size:20px}
}
</style>
</head>
<body>
<div class="shell">
  <div class="top">
    <div class="logo">
      <div class="logo-mark">حروف</div>
      <div class="logo-sub">شاشة المقدم</div>
    </div>
    <div>
      <div class="title">شاشة المقدم البشري</div>
      <div class="session" id="sessionText"></div>
    </div>
  </div>

  <div class="layout">
    <section class="board-card">
      <div class="hex-grid" id="grid"></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <span>حرف: <b id="letter">-</b></span>
        <span id="sync">جاري الربط...</span>
      </div>
      <div class="qbox">
        <div class="question" id="question">اختر خلية من اللوحة ليظهر السؤال هنا</div>
        <div class="hint">هذه الصفحة تتحكم في شاشة اللعبة الأساسية مباشرة.</div>

        <div class="teams">
          <div class="team" id="team1Box">
            <b id="team1Name">الفريق الأول</b>
            <div class="score" id="score1">0</div>
          </div>
          <div class="team" id="team2Box">
            <b id="team2Name">الفريق الثاني</b>
            <div class="score" id="score2">0</div>
          </div>
        </div>

        <div class="controls">
          <button class="btn c1" id="team1Btn">نقطة للفريق الأول</button>
          <button class="btn c2" id="team2Btn">نقطة للفريق الثاني</button>
          <button class="btn" id="answerBtn">إظهار الإجابة</button>
          <button class="btn gold" id="nextBtn">تغيير السؤال</button>
          <button class="btn" id="cancelBtn">إلغاء التحديد</button>
          <button class="btn" id="buzzerBtn">إعادة تعيين الجرس</button>
          <button class="btn wide" id="newGameBtn">بداية لعبة جديدة</button>
        </div>
        <div class="fast" id="fast"></div>
        <div class="status" id="status">بانتظار بيانات اللعبة...</div>
      </div>
    </section>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
 apiKey: "AIzaSyCgwvqKj2BQ4nepbUk1gJ9Yb4o3hJWUwOs",
 authDomain: "horof-game-9934e.firebaseapp.com",
 databaseURL: "https://horof-game-9934e-default-rtdb.europe-west1.firebasedatabase.app",
 projectId: "horof-game-9934e",
 appId: "1:44896634225:web:62a672d8c94be6e0d762d0"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();
const params=new URLSearchParams(location.search);
const session=params.get("session");
document.getElementById("sessionText").textContent=session ? "session: "+session : "لا توجد جلسة";

let state=null;
let lastBoardKey="";
const grid=document.getElementById("grid");
const controls=[...document.querySelectorAll("button")];

function send(type, extra={}){
 if(!session) return;
 db.ref("games/"+session+"/presenterCommands").push({type,...extra,ts:Date.now()});
}
function esc(s){return String(s??"")}
function renderBoard(st){
 const board=Array.isArray(st.board)?st.board:[];
 const key=JSON.stringify(board);
 if(key===lastBoardKey)return;
 lastBoardKey=key;
 grid.innerHTML="";
 const size=Number(st.gridSize||5);
 for(let r=0;r<size;r++){
   const row=document.createElement("div");
   row.className="hex-row";
   for(let c=0;c<size;c++){
     const item=board.find(x=>x.id===`${r}-${c}`);
     if(!item) continue;
     const b=document.createElement("button");
     b.type="button";
     b.className="hex "+(item.status||"neutral");
     b.textContent=item.letter||"";
     b.title="اختيار حرف "+(item.letter||"");
     b.addEventListener("click",()=>send("selectHex",{id:item.id}));
     row.appendChild(b);
   }
   grid.appendChild(row);
 }
}
function render(st){
 state=st||{};
 document.documentElement.style.setProperty("--c1",state.teamColors?.c1||"#e43b41");
 document.documentElement.style.setProperty("--c2",state.teamColors?.c2||"#0056b3");
 renderBoard(state);
 document.getElementById("letter").textContent=state.currentLetter||"-";
 document.getElementById("question").textContent=state.questionText||"اختر خلية من اللوحة ليظهر السؤال هنا";
 document.getElementById("team1Name").textContent=state.teamNames?.c1||"الفريق الأول";
 document.getElementById("team2Name").textContent=state.teamNames?.c2||"الفريق الثاني";
 document.getElementById("score1").textContent=state.scores?.c1??0;
 document.getElementById("score2").textContent=state.scores?.c2??0;
 document.getElementById("team1Btn").textContent="نقطة لـ "+(state.teamNames?.c1||"الفريق الأول");
 document.getElementById("team2Btn").textContent="نقطة لـ "+(state.teamNames?.c2||"الفريق الثاني");
 document.getElementById("answerBtn").textContent=state.answerVisible?"إخفاء الإجابة":"إظهار الإجابة";
 const fast=document.getElementById("fast");
 if(state.buzzer){fast.textContent=state.buzzer;fast.style.display="block"}else{fast.style.display="none"}
 document.getElementById("sync").textContent="متصل";
 document.getElementById("status").textContent="آخر مزامنة: "+new Date(state.ts||Date.now()).toLocaleTimeString("ar-SA");
}
if(!session){
 controls.forEach(b=>b.disabled=true);
 document.getElementById("status").textContent="افتح الصفحة من زر «شاشة المقدم البشري» داخل اللعبة.";
}else{
 db.ref("games/"+session+"/presenterState").on("value",snap=>{
   const st=snap.val();
   if(st) render(st);
 });
}
document.getElementById("team1Btn").addEventListener("click",()=>send("givePoint",{team:"c1"}));
document.getElementById("team2Btn").addEventListener("click",()=>send("givePoint",{team:"c2"}));
document.getElementById("answerBtn").addEventListener("click",()=>send("showAnswer"));
document.getElementById("nextBtn").addEventListener("click",()=>send("nextQuestion"));
document.getElementById("cancelBtn").addEventListener("click",()=>send("cancelSelection"));
document.getElementById("buzzerBtn").addEventListener("click",()=>send("resetBuzzer"));
document.getElementById("newGameBtn").addEventListener("click",()=>send("newGame"));
</script>
</body>
</html>
