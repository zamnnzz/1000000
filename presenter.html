<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>شاشة المقدم | حروف</title>
<style>
*{box-sizing:border-box}
:root{--purple:#5b2d8e;--pink:#ef3f98;--blue:#3c84ee;--c1:#e43b41;--c2:#0056b3}
body{margin:0;background:#5b2d8e;color:#fff;font-family:Tahoma,Arial,sans-serif;min-height:100vh}
.shell{width:min(980px,94vw);margin:0 auto;padding:12px 0 24px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:9px 14px;margin-bottom:12px}
.logo{display:flex;align-items:center;gap:8px}.logo-mark{font-size:25px;font-weight:1000;color:#ffd329;text-shadow:0 3px 0 rgba(0,0,0,.18)}.logo-sub{font-size:12px;font-weight:900;color:#ff675b}.title{font-size:19px;font-weight:1000;color:#ffd329}.session{font-size:10px;color:#e7d9f1;direction:ltr}
.layout{display:grid;grid-template-columns:minmax(360px,.95fr) minmax(330px,.8fr);gap:12px;align-items:start}
.board-card{background:linear-gradient(145deg,var(--pink) 0 12%,var(--blue) 12% 88%,var(--pink) 88%);border-radius:18px;padding:12px;box-shadow:0 12px 26px rgba(0,0,0,.2);overflow:hidden}
.board-scale{width:560px;max-width:100%;margin:auto;transform-origin:top center}
.hex-grid{line-height:0;margin:auto;padding:8px 0 24px}
.hex-row{display:flex;justify-content:center;margin-bottom:-30px}
.hexagon{width:105px;height:115px;display:flex;align-items:center;justify-content:center;font-size:min(4vw,34px);font-weight:900;cursor:pointer;margin:2px;transition:none;text-align:center;background:transparent;border:0;padding:0;pointer-events:none}
.hexagon polygon{pointer-events:auto}
.hexagon svg{width:100%;height:100%;overflow:visible;display:block}
.hexagon.side{opacity:0;pointer-events:none}
.hexagon.pending polygon{filter:brightness(.97)}
.panel{background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.17);border-radius:18px;overflow:hidden;box-shadow:0 12px 26px rgba(0,0,0,.14)}
.panel-head{background:linear-gradient(90deg,#9b5cf0,#e43f9c);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;font-weight:1000;font-size:13px}
.qbox{padding:14px}
.qa-label{font-size:11px;color:#eadcf4;font-weight:900;margin:0 0 5px}
.question,.answer{
 border-radius:13px;padding:12px 13px;text-align:center;display:grid;place-items:center;font-weight:1000;
}
.question{font-size:17px;line-height:1.55;min-height:72px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.13)}
.answer{font-size:18px;line-height:1.5;min-height:58px;background:#fff;color:#5b2d8e;border:2px solid #ffd54f;margin-top:6px}
.hint{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);padding:8px;border-radius:11px;text-align:center;color:#eadcf4;font-size:10px;margin:10px 0}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.team{min-height:62px;border:1px solid rgba(255,255,255,.12);border-radius:13px;padding:8px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;background:rgba(255,255,255,.07)}.team b{font-size:12px}.score{font-size:21px;font-weight:1000}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.btn{min-height:43px;border:0;border-radius:12px;font-family:inherit;font-size:12px;font-weight:1000;cursor:pointer;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.11);padding:7px}.btn.gold{background:#c39179;color:#39204f}.btn.c1{background:var(--c1)}.btn.c2{background:var(--c2)}.btn.wide{grid-column:1/-1}.fast{margin-top:9px;background:#ffd54f;color:#51217b;border-radius:10px;padding:8px 10px;text-align:center;font-size:12px;font-weight:1000;display:none}.status{font-size:9px;color:#e4d3ef;text-align:center;margin-top:8px}
@media(max-width:760px){.layout{grid-template-columns:1fr}.shell{width:min(620px,96vw)}.board-card{padding:8px}.board-scale{transform:scale(.88);margin-bottom:-52px}.top{border-radius:14px}.title{font-size:16px}}
@media(max-width:420px){.shell{width:100%;padding:6px}.top{padding:8px 10px}.logo-mark{font-size:20px}.logo-sub{font-size:10px}.title{font-size:14px}.board-scale{transform:scale(.72);margin-bottom:-115px}.qbox{padding:10px}.question{font-size:16px;min-height:60px}.btn{font-size:11px;min-height:40px}}.top{padding:8px 10px}.logo-mark{font-size:20px}.logo-sub{font-size:10px}.title{font-size:14px}.hex{width:54px;height:65px;margin:-8px}.hex-row{margin-bottom:-16px}.hex-row:nth-child(even){transform:translateX(20px)}.qbox{padding:10px}.question{font-size:16px;min-height:60px}.btn{font-size:11px;min-height:40px}}
</style>
</head>
<body>
<div class="shell">
  <div class="top">
    <div class="logo">
      <div class="logo-mark">حروف</div>
      <div class="logo-sub">شاشة المقدم</div>
    </div>
    <div>
      <div class="title">شاشة المقدم البشري</div>
      <div class="session" id="sessionText"></div>
    </div>
  </div>

  <div class="layout">
    <section class="board-card">
      <div class="board-scale"><div class="hex-grid" id="grid"></div></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <span>حرف: <b id="letter">-</b></span>
        <span id="sync">جاري الربط...</span>
      </div>
      <div class="qbox">
        <div class="qa-label">السؤال</div>
        <div class="question" id="question">اختر خلية من اللوحة ليظهر السؤال هنا</div>
        <div class="qa-label" style="margin-top:10px">الإجابة</div>
        <div class="answer" id="answer">—</div>
        <div class="hint">السؤال والإجابة يظهران هنا للمقدم فقط، والتحكم ينعكس على شاشة اللعبة الأساسية.</div>

        <div class="teams">
          <div class="team" id="team1Box">
            <b id="team1Name">الفريق الأول</b>
            <div class="score" id="score1">0</div>
          </div>
          <div class="team" id="team2Box">
            <b id="team2Name">الفريق الثاني</b>
            <div class="score" id="score2">0</div>
          </div>
        </div>

        <div class="controls">
          <button class="btn c1" id="team1Btn">نقطة للفريق الأول</button>
          <button class="btn c2" id="team2Btn">نقطة للفريق الثاني</button>
          <button class="btn gold" id="nextBtn">تغيير السؤال</button>
          <button class="btn" id="cancelBtn">إلغاء التحديد</button>
          <button class="btn" id="buzzerBtn">إعادة تعيين الجرس</button>
          <button class="btn wide" id="newGameBtn">بداية لعبة جديدة</button>
        </div>
        <div class="fast" id="fast"></div>
        <div class="status" id="status">بانتظار بيانات اللعبة...</div>
      </div>
    </section>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
 apiKey: "AIzaSyCgwvqKj2BQ4nepbUk1gJ9Yb4o3hJWUwOs",
 authDomain: "horof-game-9934e.firebaseapp.com",
 databaseURL: "https://horof-game-9934e-default-rtdb.europe-west1.firebasedatabase.app",
 projectId: "horof-game-9934e",
 appId: "1:44896634225:web:62a672d8c94be6e0d762d0"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();
const params=new URLSearchParams(location.search);
const session=params.get("session");
document.getElementById("sessionText").textContent=session ? "session: "+session : "لا توجد جلسة";

let state=null;
let lastBoardKey="";
const grid=document.getElementById("grid");
const controls=[...document.querySelectorAll("button")];

function send(type, extra={}){
 if(!session) return;
 db.ref("games/"+session+"/presenterCommands").push({type,...extra,ts:Date.now()});
}
function esc(s){return String(s??"")}
function renderBoard(st){
 const board=Array.isArray(st.board)?st.board:[];
 const key=JSON.stringify(board);
 if(key===lastBoardKey)return;
 lastBoardKey=key;
 grid.innerHTML="";
 const size=Number(st.gridSize||5);
 for(let r=0;r<size;r++){
   const row=document.createElement("div");
   row.className="hex-row";
   for(let c=0;c<size;c++){
     const item=board.find(x=>x.id===`${r}-${c}`);
     if(!item) continue;
     const hex=document.createElement("div");
     hex.className="hexagon";
     hex.id="host-"+item.id;
     hex.dataset.letter=item.letter||"";
     hex.title="اختيار حرف "+(item.letter||"");
     const fill=item.status==='selected' ? '#FFD54F' : item.status==='c1' ? (st.teamColors?.c1||'#e43b41') : item.status==='c2' ? (st.teamColors?.c2||'#0056b3') : 'white';
     const textFill=(item.status==='c1'||item.status==='c2') ? 'transparent' : '#5B2D8E';
     hex.innerHTML=`<svg viewBox="90 0 120 110" style="width:100%; height:100%;">
       <polygon points="142,4 184,28 184,76 142,100 100,76 100,28" fill="${fill}" stroke="#5B2D8E" stroke-width="6" stroke-linejoin="round" style="transition:0.2s;"></polygon>
       <text x="142" y="54" text-anchor="middle" dominant-baseline="middle" fill="${textFill}" style="font-family:'AA Galaxy',Tahoma,Arial,sans-serif;font-size:48px;pointer-events:none;">${item.letter||''}</text>
     </svg>`;
     const poly=hex.querySelector('polygon');
     poly.addEventListener('click',(e)=>{
       e.stopPropagation();
       // نفس إحساس اللعبة: تفاعل فوري بصرياً، ثم الحالة النهائية تأتي من اللعبة الأساسية.
       if(item.status==='neutral'){
         document.querySelectorAll('.hexagon polygon').forEach(p=>{
           const owner=p.closest('.hexagon');
           const boardItem=board.find(x=>'host-'+x.id===owner.id);
           if(boardItem && boardItem.status==='selected') p.setAttribute('fill','white');
         });
         poly.setAttribute('fill','#FFD54F');
       }else{
         poly.setAttribute('fill','white');
       }
       send('selectHex',{id:item.id});
     });
     row.appendChild(hex);
   }
   grid.appendChild(row);
 }
}
function render(st){
 state=st||{};
 document.documentElement.style.setProperty("--c1",state.teamColors?.c1||"#e43b41");
 document.documentElement.style.setProperty("--c2",state.teamColors?.c2||"#0056b3");
 renderBoard(state);
 document.getElementById("letter").textContent=state.currentLetter||"-";
 document.getElementById("question").textContent=state.questionText||"اختر خلية من اللوحة ليظهر السؤال هنا";
 document.getElementById("answer").textContent=state.answerText||"—";
 document.getElementById("team1Name").textContent=state.teamNames?.c1||"الفريق الأول";
 document.getElementById("team2Name").textContent=state.teamNames?.c2||"الفريق الثاني";
 document.getElementById("score1").textContent=state.scores?.c1??0;
 document.getElementById("score2").textContent=state.scores?.c2??0;
 document.getElementById("team1Btn").textContent="نقطة لـ "+(state.teamNames?.c1||"الفريق الأول");
 document.getElementById("team2Btn").textContent="نقطة لـ "+(state.teamNames?.c2||"الفريق الثاني");
 const fast=document.getElementById("fast");
 if(state.buzzer){fast.textContent=state.buzzer;fast.style.display="block"}else{fast.style.display="none"}
 document.getElementById("sync").textContent="● متصل";
 document.getElementById("status").textContent="آخر مزامنة: "+new Date(state.ts||Date.now()).toLocaleTimeString("ar-SA");
}
if(!session){
 controls.forEach(b=>b.disabled=true);
 document.getElementById("status").textContent="افتح الصفحة من زر «شاشة المقدم البشري» داخل اللعبة.";
}else{
 db.ref("games/"+session+"/presenterState").on("value",snap=>{
   const st=snap.val();
   if(st){ render(st); }
   else { document.getElementById("sync").textContent="بانتظار اللعبة"; }
 },()=>{
   document.getElementById("sync").textContent="تعذر الربط";
   document.getElementById("status").textContent="تأكد أن شاشة اللعبة الأساسية مفتوحة على نفس الجلسة.";
 });
}
document.getElementById("team1Btn").addEventListener("click",()=>send("givePoint",{team:"c1"}));
document.getElementById("team2Btn").addEventListener("click",()=>send("givePoint",{team:"c2"}));
document.getElementById("nextBtn").addEventListener("click",()=>send("nextQuestion"));
document.getElementById("cancelBtn").addEventListener("click",()=>send("cancelSelection"));
document.getElementById("buzzerBtn").addEventListener("click",()=>send("resetBuzzer"));
document.getElementById("newGameBtn").addEventListener("click",()=>send("newGame"));
</script>
</body>
</html>
