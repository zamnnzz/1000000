<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>شاشة المقدم | حروف</title>
<style>
@font-face{
  font-family:"AA Galaxy";
  src:url("https://raw.githubusercontent.com/zamnnzz/fonts/main/hroffont-B6Zk_0ya.woff2") format("woff2");
  font-weight:normal;
  font-style:normal;
  font-display:swap;
}
*{box-sizing:border-box}
:root{
  --purple:#5b2d8e;
  --purple-dark:#31164f;
  --purple-soft:#7c4aaa;
  --gold:#ffd54f;
  --c1:#e43b41;
  --c2:#0056b3;
  --panel:rgba(255,255,255,.10);
  --line:rgba(255,255,255,.14);
}
html,body,button,input,textarea,select{
  font-family:"AA Galaxy",sans-serif!important;
}
body{
  margin:0;
  min-height:100vh;
  color:#fff;
  background:
    radial-gradient(circle at 15% 12%,rgba(236,63,152,.18),transparent 28%),
    radial-gradient(circle at 86% 78%,rgba(60,132,238,.15),transparent 28%),
    linear-gradient(145deg,#32164f 0%,#572b83 52%,#32164f 100%);
}
button{font-family:inherit}
.shell{
  width:min(1180px,96vw);
  margin:0 auto;
  padding:14px 0 26px;
}
.top{
  min-height:62px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  padding:10px 16px;
  margin-bottom:14px;
  border:1px solid var(--line);
  border-radius:20px;
  background:rgba(31,13,48,.48);
  backdrop-filter:blur(14px);
}
.brand{display:flex;align-items:center;gap:10px}
.logo-mark{
  font-size:25px;
  font-weight:1000;
  color:var(--gold);
  line-height:1;
}
.logo-sub{
  font-size:11px;
  color:#eadcf3;
  opacity:.85;
}
.top-right{display:flex;align-items:center;gap:10px}
.title{
  font-size:15px;
  font-weight:1000;
  color:#fff;
}
.connection{
  display:inline-flex;
  align-items:center;
  gap:7px;
  min-height:34px;
  padding:0 11px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.08);
  font-size:11px;
  color:#fff;
}
.connection::before{
  content:"";
  width:8px;height:8px;border-radius:50%;
  background:#45e88c;
  box-shadow:0 0 0 4px rgba(69,232,140,.12);
}
.session{
  font-size:9px;
  direction:ltr;
  color:#cdb9dc;
  opacity:.72;
}
.layout{
  display:grid;
  grid-template-columns:minmax(500px,1.15fr) minmax(360px,.78fr);
  gap:14px;
  align-items:start;
}

/* شبكة اللعبة — نفس بناء الخلية الحالي بدون تغيير */
.board-card{
  position:relative;
  overflow:hidden;
  border-radius:24px;
  padding:18px 16px;
  min-height:565px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--c2,#0056b3);
  border:1px solid rgba(255,255,255,.16);
  box-shadow:0 22px 50px rgba(14,5,24,.28);
}
.board-card::before{
  content:"";
  position:absolute;
  inset:0;
  background:var(--c1,#e43b41);
  clip-path:polygon(0 0,50% 50%,100% 0,100% 100%,50% 50%,0 100%);
  pointer-events:none;
}
.board-card::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,.08),transparent 28%,rgba(0,0,0,.08));
  pointer-events:none;
}
.board-scale{
  width:560px;
  max-width:100%;
  margin:auto;
  transform-origin:center;
  position:relative;
  z-index:2;
}
.hex-grid{
  position:relative;
  z-index:10;
  line-height:0;
  margin:auto;
  transform:translate(-10px,0);
  padding:8px 0 24px;
}
.row{
  display:flex;
  justify-content:center;
  margin-bottom:-30px;
}
.hex-grid .row:nth-child(even){
  transform:translateX(35px);
}
.hexagon{
  width:100px;
  height:120px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
  font-weight:900;
  cursor:pointer;
  margin:-15px;
  transition:none;
  text-align:center;
  pointer-events:none;
}
.hexagon polygon{pointer-events:auto}
.hexagon.side{opacity:0;pointer-events:none}

/* لوحة التحكم */
.panel{
  border:1px solid var(--line);
  border-radius:24px;
  overflow:hidden;
  background:rgba(24,10,38,.58);
  backdrop-filter:blur(16px);
  box-shadow:0 22px 50px rgba(14,5,24,.24);
}
.panel-head{
  padding:14px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  border-bottom:1px solid var(--line);
  background:rgba(255,255,255,.055);
}
.current-letter{
  display:flex;
  align-items:center;
  gap:9px;
  font-size:12px;
  color:#dac6e8;
}
.current-letter b{
  display:grid;
  place-items:center;
  width:36px;height:36px;
  border-radius:12px;
  background:var(--gold);
  color:var(--purple);
  font-size:21px;
}
.qbox{padding:14px}
.qa-block{
  padding:14px;
  border:1px solid rgba(255,255,255,.10);
  border-radius:17px;
  background:rgba(255,255,255,.055);
}
.qa-block + .qa-block{margin-top:10px}
.qa-label{
  margin:0 0 7px;
  font-size:10px;
  color:#cdb8dc;
}
.question{
  min-height:74px;
  display:grid;
  place-items:center;
  text-align:center;
  font-size:18px;
  line-height:1.55;
  font-weight:1000;
  color:#fff;
}
.answer-card{
  background:#fff;
  color:var(--purple);
  border-color:rgba(255,213,79,.55);
}
.answer{
  min-height:52px;
  display:grid;
  place-items:center;
  text-align:center;
  font-size:20px;
  line-height:1.45;
  font-weight:1000;
}
.teams{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:11px;
}
.team{
  min-height:74px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:3px;
  padding:10px;
  border:2px solid rgba(255,255,255,.12);
  border-radius:16px;
  background:rgba(255,255,255,.055);
  transition:.15s ease;
}
.team b{font-size:11px}
.score{font-size:25px;font-weight:1000}
.team.active-team{
  transform:translateY(-1px);
  box-shadow:0 0 0 2px rgba(255,255,255,.12) inset,0 8px 18px rgba(0,0,0,.18);
}
#team1Box.active-team{background:var(--c1,#e43b41)}
#team2Box.active-team{background:var(--c2,#0056b3)}
#team1Box.active-team *,#team2Box.active-team *{color:#fff}

.controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:11px;
}
.btn{
  min-height:46px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:14px;
  padding:8px 10px;
  cursor:pointer;
  color:#fff;
  background:rgba(255,255,255,.075);
  font-size:11px;
  font-weight:1000;
  transition:transform .12s ease,filter .12s ease,background .12s ease;
}
.btn:hover{transform:translateY(-1px);filter:brightness(1.06)}
.btn.c1{background:var(--c1)}
.btn.c2{background:var(--c2)}
.btn.gold{
  color:#42205f;
  background:linear-gradient(135deg,#ffd54f,#ffb82e);
  border-color:transparent;
}
.btn.wide{grid-column:1/-1}
.fast{
  display:none;
  margin-top:10px;
  padding:10px 12px;
  border-radius:14px;
  text-align:center;
  font-size:12px;
  font-weight:1000;
  background:var(--gold);
  color:#51217b;
  border:1px solid transparent;
}
.fast.c1{background:var(--c1);color:#fff;border-color:rgba(255,255,255,.32)}
.fast.c2{background:var(--c2);color:#fff;border-color:rgba(255,255,255,.32)}

@media(max-width:930px){
  .layout{grid-template-columns:1fr}
  .board-card{min-height:auto}
  .panel{max-width:720px;margin:0 auto;width:100%}
}
@media(max-width:620px){
  .shell{width:100%;padding:8px}
  .top{border-radius:16px;padding:9px 11px}
  .title{font-size:12px}
  .session{display:none}
  .board-card{padding:9px;border-radius:18px}
  .board-scale{transform:scale(.80);margin-top:-42px;margin-bottom:-42px}
  .panel{border-radius:18px}
  .qbox{padding:10px}
  .question{font-size:16px;min-height:62px}
  .answer{font-size:18px}
  .controls{gap:7px}
  .btn{font-size:10px;min-height:43px}
}
@media(max-width:420px){
  .top-right .title{display:none}
  .logo-mark{font-size:21px}
  .board-scale{transform:scale(.68);margin-top:-86px;margin-bottom:-86px}
  .teams{gap:7px}
}
</style>
</head>
<body>
<div class="shell">
  <div class="top">
    <div class="brand">
      <div class="logo-mark">حروف</div>
      <div class="logo-sub">لوحة المقدم</div>
    </div>
    <div class="top-right">
      <div class="title">تحكم مباشر باللعبة</div>
      <div class="connection" id="sync">جاري الربط...</div>
      <div class="session" id="sessionText"></div>
    </div>
  </div>

  <div class="layout">
    <section class="board-card">
      <div class="board-scale">
        <div class="hex-grid" id="grid"></div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <div class="current-letter">
          <span>الحرف الحالي</span>
          <b id="letter">-</b>
        </div>
      </div>

      <div class="qbox">
        <div class="qa-block">
          <div class="qa-label">السؤال</div>
          <div class="question" id="question">اختر حرفًا من الشبكة</div>
        </div>

        <div class="qa-block answer-card">
          <div class="qa-label" style="color:#8763a2">الإجابة</div>
          <div class="answer" id="answer">—</div>
        </div>

        <div class="teams">
          <div class="team" id="team1Box">
            <b id="team1Name">الفريق الأول</b>
            <div class="score" id="score1">0</div>
          </div>
          <div class="team" id="team2Box">
            <b id="team2Name">الفريق الثاني</b>
            <div class="score" id="score2">0</div>
          </div>
        </div>

        <div class="controls">
          <button class="btn c1" id="team1Btn">نقطة للفريق الأول</button>
          <button class="btn c2" id="team2Btn">نقطة للفريق الثاني</button>
          <button class="btn gold" id="nextBtn">تغيير السؤال</button>
          <button class="btn" id="buzzerBtn">إعادة الجرس</button>
          <button class="btn wide" id="newGameBtn">بداية لعبة جديدة</button>
        </div>

        <div class="fast" id="fast"></div>
      </div>
    </section>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
 apiKey: "AIzaSyCgwvqKj2BQ4nepbUk1gJ9Yb4o3hJWUwOs",
 authDomain: "horof-game-9934e.firebaseapp.com",
 databaseURL: "https://horof-game-9934e-default-rtdb.europe-west1.firebasedatabase.app",
 projectId: "horof-game-9934e",
 appId: "1:44896634225:web:62a672d8c94be6e0d762d0"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();
const params=new URLSearchParams(location.search);
const session=params.get("session");
document.getElementById("sessionText").textContent=session ? "session: "+session : "لا توجد جلسة";

let state=null;
let lastBoardKey="";
const pendingCellColors = new Map();
const grid=document.getElementById("grid");
const controls=[...document.querySelectorAll("button")];

function send(type, extra={}){
 if(!session) return;

 // تلوين فوري في شاشة المقدم فقط عند اختيار الفريق.
 // لا نحسب نقاط محليًا؛ اللعبة الأساسية تبقى المصدر النهائي للحالة.
 if(type === "givePoint" && state && state.selectedId && Array.isArray(state.board)){
   const selectedId = state.selectedId;
   const selected = state.board.find(x=>x.id===selectedId);
   if(selected && (extra.team === "c1" || extra.team === "c2")){
     pendingCellColors.set(selectedId, extra.team);
     selected.status = extra.team;
     state.selectedId = null;
     lastBoardKey = "";
     renderBoard(state);

     // حماية فقط من بقاء لون مؤقت لو فشل الأمر نهائيًا.
     setTimeout(()=>{
       if(pendingCellColors.has(selectedId)){
         pendingCellColors.delete(selectedId);
         lastBoardKey = "";
         if(state) renderBoard(state);
       }
     }, 5000);
   }
 }

 db.ref("games/"+session+"/presenterCommands").push({type,...extra,ts:Date.now()});
}
function esc(s){return String(s??"")}
function renderBoard(st){
 const board=Array.isArray(st.board)?st.board:[];
 const key=JSON.stringify({board,teamColors:st.teamColors,selectedId:st.selectedId});
 if(key===lastBoardKey)return;
 lastBoardKey=key;
 grid.innerHTML="";

 const size=Number(st.gridSize||5);

 for(let r = 0; r < size; r++){
   const row = document.createElement('div');
   row.className = 'row';
   grid.appendChild(row);

   for(let c = 0; c < size; c++){
     const item = board.find(x=>x.id===`${r}-${c}`);
     if(!item) continue;

     const hex = document.createElement('div');
     hex.className = 'hexagon';
     hex.dataset.letter = item.letter || "";
     hex.id = "host-" + item.id;
     hex.title = "اختيار حرف " + (item.letter || "");

     // نفس كود رسم الخلية المستخدم داخل createHexGrid في اللعبة الأساسية.
     hex.innerHTML = `
<svg viewBox="90 0 120 110" style="width:100%; height:100%;">

<polygon 
points="142,4 184,28 184,76 142,100 100,76 100,28"
fill="white"
stroke="#5B2D8E"
stroke-width="6"
stroke-linejoin="round"
style="transition: 0.2s;"
></polygon>

      <defs>
  <linearGradient id="gradText-${r}-${c}" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="100%" stop-color="#e0e0e0"/>
  </linearGradient>
</defs>
<text
  x="142"
  y="54"
  text-anchor="middle"
  dominant-baseline="middle"
  fill="#5B2D8E"
  style="
    font-family:'AA Galaxy', sans-serif;
    font-size:48px;
    pointer-events:none;
  "
>
  ${item.letter || ""}
</text>
      </svg>
      `;

     const poly = hex.querySelector("polygon");
     const text = hex.querySelector("text");

     // إذا ضغط المقدم تلوين، احتفظ باللون فورًا حتى تؤكد اللعبة الأساسية الحالة.
     const pendingTeam = pendingCellColors.get(item.id);
     const effectiveStatus = pendingTeam || item.status;

     // إذا وصلت الحالة الحقيقية من اللعبة بنفس اللون، انتهت الحاجة للحالة المؤقتة.
     if(pendingTeam && item.status === pendingTeam){
       pendingCellColors.delete(item.id);
     }

     if(effectiveStatus === "selected" || (!pendingTeam && st.selectedId === item.id)){
       poly.setAttribute("fill", "#FFD54F");
       text.style.display = "";
       text.setAttribute("fill", "#5B2D8E");
       hex.classList.add("selected");
     }else if(effectiveStatus === "c1"){
       poly.setAttribute("fill", st.teamColors?.c1 || "#e43b41");
       text.setAttribute("fill", "transparent");
       text.style.display = "none";
     }else if(effectiveStatus === "c2"){
       poly.setAttribute("fill", st.teamColors?.c2 || "#0056b3");
       text.setAttribute("fill", "transparent");
       text.style.display = "none";
     }else{
       poly.setAttribute("fill", "white");
       text.style.display = "";
       text.setAttribute("fill", "#5B2D8E");
     }

     // الضغط يرسل أمر الضغط إلى نفس خلية اللعبة الأساسية؛
     // اللعبة الأصلية هي التي تقرر التحديد/الإلغاء/التلوين ثم ترسل الحالة للهوست.
     poly.addEventListener("click",(e)=>{
       e.stopPropagation();

       // نفس منطق اللعبة الأساسية بشكل فوري على شاشة المقدم
       // ثم ترسل الضغطة للعبة الأساسية لتكون هي المصدر النهائي للحالة.
       if(state && Array.isArray(state.board)){
         const clicked = state.board.find(x=>x.id===item.id);
         if(clicked){
           if(clicked.status !== "neutral"){
             clicked.status = "neutral";
             if(state.selectedId === item.id) state.selectedId = null;
           }else{
             state.board.forEach(x=>{
               if(x.status === "selected") x.status = "neutral";
             });
             clicked.status = "selected";
             state.selectedId = item.id;
           }
           lastBoardKey = "";
           renderBoard(state);
         }
       }

       send("selectHex",{id:item.id});
     });

     row.appendChild(hex);
   }
 }
}

function render(st){
 state=st||{};
 document.documentElement.style.setProperty("--c1",state.teamColors?.c1||"#e43b41");
 document.documentElement.style.setProperty("--c2",state.teamColors?.c2||"#0056b3");
 renderBoard(state);
 document.getElementById("letter").textContent=state.currentLetter||"-";
 document.getElementById("question").textContent=state.questionText||"اختر خلية من اللوحة ليظهر السؤال هنا";
 document.getElementById("answer").textContent=state.answerText||"—";
 document.getElementById("team1Name").textContent=state.teamNames?.c1||"الفريق الأول";
 document.getElementById("team2Name").textContent=state.teamNames?.c2||"الفريق الثاني";
 document.getElementById("score1").textContent=state.scores?.c1??0;
 document.getElementById("score2").textContent=state.scores?.c2??0;
 document.getElementById("team1Btn").textContent="نقطة لـ "+(state.teamNames?.c1||"الفريق الأول");
 document.getElementById("team2Btn").textContent="نقطة لـ "+(state.teamNames?.c2||"الفريق الثاني");

 const t1=document.getElementById("team1Box"), t2=document.getElementById("team2Box");
 t1.style.borderColor=state.teamColors?.c1||"#e43b41";
 t2.style.borderColor=state.teamColors?.c2||"#0056b3";
 document.getElementById("team1Btn").style.background=state.teamColors?.c1||"#e43b41";
 document.getElementById("team2Btn").style.background=state.teamColors?.c2||"#0056b3";
 t1.classList.toggle("active-team",state.buzzerTeam==="c1");
 t2.classList.toggle("active-team",state.buzzerTeam==="c2");
 const fast=document.getElementById("fast");
 fast.classList.remove("c1","c2");
 if(state.buzzer){
   fast.textContent=state.buzzer;
   fast.style.display="block";
   if(state.buzzerTeam==="c1"||state.buzzerTeam==="c2") fast.classList.add(state.buzzerTeam);
 }else{
   fast.style.display="none";
 }
 document.getElementById("sync").textContent="● متصل";
}
if(!session){
 controls.forEach(b=>b.disabled=true);
}else{
 db.ref("games/"+session+"/presenterState").on("value",snap=>{
   const st=snap.val();
   if(st){ render(st); }
   else { document.getElementById("sync").textContent="بانتظار اللعبة"; }
 },()=>{
   document.getElementById("sync").textContent="تعذر الربط";
 });
}
document.getElementById("team1Btn").addEventListener("click",()=>send("givePoint",{team:"c1"}));
document.getElementById("team2Btn").addEventListener("click",()=>send("givePoint",{team:"c2"}));
document.getElementById("nextBtn").addEventListener("click",()=>send("nextQuestion"));
document.getElementById("buzzerBtn").addEventListener("click",()=>send("resetBuzzer"));
document.getElementById("newGameBtn").addEventListener("click",()=>send("newGame"));
</script>
</body>
</html>
