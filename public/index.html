<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>الجواب المجهول</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="grain"></div>
<main class="shell">
  <header class="topbar"><div class="brand">؟ الجواب المجهول</div><button id="leaveBtn" class="iconBtn hidden">خروج</button></header>

  <section id="home" class="screen card hero">
    <div class="tv">؟</div>
    <h1>الجواب المجهول</h1>
    <p>اخدع أصحابك بإجابة مقنعة… ولا تطيح في فخهم.</p>
    <div class="stack">
      <button class="primary" id="createBtn">إنشاء غرفة</button>
      <button class="secondary" id="joinOpenBtn">دخول غرفة</button>
    </div>
  </section>

  <section id="nameScreen" class="screen card hidden">
    <h2 id="nameTitle">اكتب اسمك</h2>
    <input id="nameInput" maxlength="20" placeholder="اسم اللاعب" autocomplete="off" />
    <input id="codeInput" maxlength="5" placeholder="كود الغرفة" autocomplete="off" />
    <div class="emojiPickerWrap">
      <div class="emojiPickerTitle">اختر شخصيتك</div>
      <div id="emojiPicker" class="emojiPicker" aria-label="اختيار شخصية اللاعب"></div>
      <div id="emojiHint" class="emojiHint">اختر إيموجي واحد</div>
    </div>
    <button class="primary" id="confirmJoinBtn">دخول</button>
    <div class="nameActions singleAction">
      <button class="secondary" id="nameBackBtn">رجوع</button>
    </div>
  </section>

  <section id="lobby" class="screen hidden">
    <div class="card roomHead">
      <div><span class="muted">كود الغرفة</span><strong id="roomCode">-----</strong></div>
      <button id="copyBtn" class="secondary small hostOnlyInvite">مشاركة الجلسة</button>
    </div>
    <div class="grid2">
      <div id="qrCard" class="card qrCard hostOnlyInvite"><div id="qrImg" class="qrBox"></div><p>امسح الرمز من الجوال</p></div>
      <div class="card"><h3>اللاعبون <span id="countBadge" class="badge">0</span></h3><div id="players" class="players"></div><p class="muted">الحد الأدنى لاعبين</p></div>
    </div>
    <button id="startBtn" class="primary hidden">ابدأ اللعبة</button>
  </section>

  <section id="game" class="screen hidden">
    <div class="scoreStrip" id="scoreStrip"></div>
    <div class="card gameCard">
      <div class="phaseRow"><div class="phase" id="phaseLabel">السؤال</div><div id="timer" class="timer hidden"><div class="timerTrack"><div id="timerFill" class="timerFill"></div></div><b id="timerNum">15</b></div></div>
      <h2 id="questionText"></h2>
      <div id="answerArea" class="stack">
        <input id="answerInput" maxlength="60" placeholder="اكتب إجابة تخدع البقية" autocomplete="off" />
        <button id="submitAnswerBtn" class="primary">ثبت الإجابة</button>
      </div>
      <div id="voteArea" class="hidden"><div id="options" class="options"></div><button id="confirmVoteBtn" class="primary voteConfirm" disabled>تأكيد الاختيار</button></div>
      <div id="waiting" class="waiting hidden">تم الإرسال… ننتظر البقية</div>
      <div id="resultsArea" class="hidden"></div>
    </div>
    <button id="nextBtn" class="primary hidden">السؤال التالي</button>
  </section>

  <div id="toast" class="toast hidden"></div>
</main>

<div id="sessionModal" class="modalOverlay hidden" role="dialog" aria-modal="true" aria-labelledby="sessionModalTitle">
  <div class="sessionModal card">
    <div class="sessionIcon">↩</div>
    <h2 id="sessionModalTitle">عندك جلسة سابقة</h2>
    <p id="sessionModalText">تبغى ترجع لها؟</p>
    <div class="sessionModalActions">
      <button id="resumeSessionBtn" class="primary">الرجوع للجلسة</button>
      <button id="discardSessionBtn" class="secondary">لا، ابدأ من جديد</button>
    </div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
