<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>اللعب | تلفزيون خربان</title><link rel="stylesheet" href="/assets/style.css"></head>
<body class="play-body">
<div class="grain"></div>
<header class="gamebar">
  <a class="brand small" href="/">📺 <span>تلفزيون خربان</span></a>
  <div class="progress-wrap"><span id="roundText">الجولة</span><div class="progress"><i id="progressBar"></i></div></div>
  <button class="icon-btn" id="quitBtn" title="إنهاء">✕</button>
</header>

<main class="game-main">
  <section id="handoff" class="handoff-card hidden">
    <div class="avatar big" id="handoffAvatar">م</div>
    <span class="eyebrow">مرّر الجوال</span>
    <h1>الدور على <span id="handoffName">محمد</span></h1>
    <p>لا تخلي أحد يشوف الشاشة 👀</p>
    <button id="readyBtn" class="btn btn-main xl">أنا جاهز</button>
  </section>

  <section id="task" class="task-card hidden">
    <div class="task-top"><div><span class="eyebrow" id="taskType">اكتب</span><h1 id="taskTitle">اكتب جملة</h1></div><div class="timer-off">بدون مؤقت ✨</div></div>
    <div id="previousBox" class="previous-box hidden"></div>

    <div id="textTask" class="task-content hidden">
      <textarea id="answerInput" maxlength="120" placeholder="مثال: بطريق يطلب كبسة من المطعم"></textarea>
      <div class="counter"><span id="charCount">0</span>/120</div>
    </div>

    <div id="drawTask" class="task-content hidden">
      <div class="canvas-shell"><canvas id="drawCanvas" width="1000" height="650"></canvas></div>
      <div class="tools">
        <div class="colors">
          <button class="color active" data-color="#202033" style="--c:#202033"></button>
          <button class="color" data-color="#6e4cff" style="--c:#6e4cff"></button>
          <button class="color" data-color="#ff5d8f" style="--c:#ff5d8f"></button>
          <button class="color" data-color="#ffb238" style="--c:#ffb238"></button>
          <button class="color" data-color="#23b89a" style="--c:#23b89a"></button>
        </div>
        <input id="brushSize" type="range" min="3" max="28" value="8">
        <button id="undoBtn" class="tool-btn">↶ تراجع</button><button id="clearBtn" class="tool-btn">مسح</button>
      </div>
    </div>

    <button id="submitBtn" class="btn btn-main xl full">تم، مرّرها ←</button>
  </section>
</main>
<script src="/assets/app.js"></script>
</body></html>
