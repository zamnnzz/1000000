<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>الغرفة | تلفزيون خربان</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="shell">
    <section class="card">
      <div class="topline">
        <a href="/" class="link">الرئيسية</a>
        <span id="roomCode" class="code"></span>
      </div>
      <h1>غرفة اللعب</h1>

      <div id="joinBox" class="stack">
        <input id="playerName" maxlength="18" placeholder="اكتب اسمك">
        <button id="enterRoom" class="primary">دخول</button>
      </div>

      <div id="lobby" class="hidden">
        <h2>اللاعبون</h2>
        <div id="players" class="players"></div>
        <div class="actions">
          <button id="addBot" class="secondary">إضافة لاعب تجريبي</button>
          <button id="startGame" class="primary">ابدأ اللعبة</button>
        </div>
        <p class="hint">للتجربة السريعة أضف لاعبين تجريبيين. هذه النسخة تعمل مباشرة بعد الرفع.</p>
      </div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
