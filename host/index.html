<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Top 10 — الهوست</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body class="host-page">
<div class="stars"></div>
<header class="host-header">
  <a href="/" class="logo-small">TOP <span>10</span></a>
  <div id="connectionBadge" class="connection-badge">جاري الاتصال...</div>
</header>

<main class="host-wrap">
  <section id="badSession" class="host-card hidden">
    <h1>الرابط غير صحيح</h1>
    <p class="muted">افتح رابط الهوست الذي ظهر على شاشة العرض.</p>
  </section>

  <section id="readyHost" class="host-card hidden">
    <span class="eyebrow">الجلسة جاهزة</span>
    <h1 id="readyTitle">جاهز تبدأ؟</h1>
    <p class="muted">راجع الاختيارات ثم ابدأ اللعب.</p>
    <div id="readyPicks" class="ready-picks"></div>
    <button id="startGameBtn" class="primary">ابدأ اللعب ▶</button>
  </section>

  <section id="controlHost" class="host-card hidden">
    <div class="host-control-head">
      <div>
        <span class="eyebrow" id="hostRoundLabel"></span>
        <h1 id="hostCategory"></h1>
        <p id="hostQuestion"></p>
      </div>
      <div class="host-scores">
        <span><b id="hostName1"></b><strong id="hostScore1">0</strong></span>
        <span><b id="hostName2"></b><strong id="hostScore2">0</strong></span>
      </div>
    </div>

    <div class="host-turn">الدور: <strong id="hostTurnName"></strong></div>

    <h3>اضغط الإجابة التي قالها الفريق</h3>
    <div id="hostAnswers" class="host-answers"></div>

    <div class="host-actions">
      <button id="wrongBtn" class="wrong-btn">✕ إجابة خطأ</button>
      <button id="nextRoundBtn" class="next-btn hidden">الجولة التالية ←</button>
    </div>
  </section>

  <section id="finishHost" class="host-card hidden">
    <div class="trophy small">🏆</div>
    <h1 id="hostWinner"></h1>
    <p id="hostFinalScore" class="muted"></p>
  </section>
</main>

<script type="module" src="/assets/host.js"></script>
</body>
</html>
