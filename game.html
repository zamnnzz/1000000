<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>من أنا؟</title>
<style>
:root{
  --navy:#18384c;
  --bg:#f3f8e5;
  --dot:#d8e7c6;
  --team1:#bfd7ba;
  --team2:#d0efdc;
  --center:#edf7cf;
  --panel:#eaf8d2;
  --question:#f7f8e8;
  --free:#b8eab1;
  --blue:#70d1ef;
  --green:#2d6b69;
  --orange:#ff7e31;
  --shadow:#a9b89b;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Tahoma,"Segoe UI",Arial,sans-serif;color:var(--navy)}
body{
  background-color:var(--bg);
  background-image:radial-gradient(circle,var(--dot) 2px,transparent 2.2px);
  background-size:16px 16px;
  overflow:hidden;
}
.hidden{display:none!important}
.shell{height:100%;display:flex;flex-direction:column}
.scoreboard{
  flex:0 0 clamp(118px,15.5vh,150px);
  display:grid;
  grid-template-columns:minmax(0,1fr) clamp(92px,6.8vw,110px) minmax(0,1fr);
  border:3px solid var(--navy);
  background:white;
}
.team{
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  font-weight:900;text-align:center;padding:8px 20px
}
.team.left{background:var(--team2)}
.team.right{background:var(--team1)}
.team-name{font-size:clamp(16px,1.15vw,20px);margin-bottom:2px}
.team-score{font-size:clamp(43px,3.9vw,61px);line-height:1}
.center{
  background:var(--center);
  border-left:1px solid #a3b99d;border-right:1px solid #a3b99d;
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  gap:5px;padding:7px
}
.logo-mini{font-size:clamp(24px,2vw,31px);font-weight:1000;line-height:.78;text-align:center;letter-spacing:-2px}
.stars{font-size:clamp(15px,1.15vw,19px);letter-spacing:1px;line-height:1}
.options{
  border:0;background:var(--navy);color:#fff;border-radius:11px;
  padding:7px 12px;font-size:clamp(11px,.75vw,13px);font-weight:900
}
.stage{
  flex:1;min-height:0;display:flex;align-items:center;justify-content:center;
  padding:clamp(28px,5vh,54px) 20px;
}
.card{
  position:relative;
  width:min(770px,47vw);
  min-width:620px;
  background:var(--panel);
  border:3px solid var(--navy);
  border-radius:18px;
  box-shadow:0 8px 0 rgba(24,56,76,.18);
  padding:40px 28px 26px;
}
.qnum{
  position:absolute;top:-22px;left:28px;
  background:var(--navy);color:#fff;border-radius:15px;
  padding:8px 14px;font-size:14px;font-weight:900
}
.tag{
  position:absolute;right:27px;top:-34px;
  border:3px solid var(--navy);border-radius:10px;
  padding:10px 18px;font-weight:900;font-size:clamp(20px,1.6vw,27px);
  transform:rotate(4deg);box-shadow:0 4px 0 rgba(24,56,76,.15)
}
.tag.blue{background:var(--blue)}
.tag.green{background:var(--green);color:#fff}
.question{
  background:var(--question);
  border:3px solid var(--navy);
  border-radius:17px;
  padding:18px 24px;
  min-height:136px;
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  text-align:center;font-size:clamp(22px,1.9vw,31px);line-height:1.55;font-weight:900;
  box-shadow:0 5px 0 rgba(24,56,76,.30);
}
.pause{font-size:24px;color:#65cde8;line-height:1;margin-bottom:6px}
.answers{
  display:grid;grid-template-columns:1fr 1fr;
  gap:10px 12px;margin-top:14px
}
.answer{
  min-height:59px;background:#fff;border:3px solid var(--navy);border-radius:10px;
  box-shadow:0 4px 0 rgba(24,56,76,.32);
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:9px 12px 9px 16px;font-size:clamp(16px,1.15vw,20px);font-weight:800
}
.letter{
  width:36px;height:36px;flex:0 0 36px;border-radius:50%;
  background:var(--orange);border:2px solid var(--navy);
  display:grid;place-items:center;font-weight:900
}
.free{
  background:var(--free);
  border:3px solid var(--navy);
  border-radius:17px;
  box-shadow:0 5px 0 rgba(24,56,76,.30);
  min-height:78px;padding:18px 24px;
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(21px,1.65vw,27px);font-weight:900;line-height:1.6;text-align:center
}
.buzzer-line{
  position:absolute;left:50%;transform:translateX(-50%);
  bottom:-42px;
  background:transparent;
  font-weight:900;
  font-size:14px;
  white-space:nowrap
}
.buzzer-line.open{color:#237148}
.buzzer-line.win{color:#b75617}
@media (max-width:1100px){
  .card{width:min(760px,84vw);min-width:0}
}
@media (max-width:700px){
  body{overflow:auto}
  .scoreboard{grid-template-columns:1fr 78px 1fr;flex-basis:104px}
  .team-name{font-size:13px}.team-score{font-size:38px}
  .logo-mini{font-size:19px}.options{padding:6px 8px;font-size:9px}
  .stage{align-items:flex-start;padding-top:72px}
  .card{width:94vw;padding:34px 14px 20px}
  .tag{right:16px;font-size:18px;top:-29px}
  .qnum{left:16px}
  .question{font-size:20px;min-height:110px;padding:15px}
  .answers{grid-template-columns:1fr}
}
@media (max-height:670px) and (orientation:landscape){
  .scoreboard{flex-basis:92px}
  .team-score{font-size:38px}
  .stage{padding:28px 15px}
  .card{width:min(690px,76vw);padding:31px 22px 19px}
  .question{font-size:19px;min-height:95px;padding:12px 18px}
  .answer{min-height:46px;padding:7px 10px;font-size:15px}
  .letter{width:30px;height:30px;flex-basis:30px}
}

.modal.hidden{display:none!important}
.modal{
  position:fixed;inset:0;z-index:60;background:rgba(24,56,76,.35);
  display:flex;align-items:center;justify-content:center;padding:20px
}
.modal-card{
  width:min(720px,94vw);max-height:90vh;overflow:auto;
  background:var(--panel);border:3px solid var(--navy);border-radius:20px;
  box-shadow:0 9px 0 rgba(24,56,76,.25);padding:22px
}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.modal-head h2{margin:0}
.close-btn{
  border:3px solid var(--navy);background:#fff;color:var(--navy);
  width:40px;height:40px;border-radius:10px;font-weight:1000;cursor:pointer
}
.menu-btn{
  width:100%;border:3px solid var(--navy);background:#fff;color:var(--navy);
  border-radius:13px;padding:14px;font-weight:900;cursor:pointer;margin-top:10px
}
.qr-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.qr-card{
  background:#f7f8e8;border:3px solid var(--navy);border-radius:16px;padding:16px;text-align:center
}
.qr-card h3{margin:0 0 8px}
.qr-settings-box{
  width:190px;height:190px;margin:10px auto;background:#fff;
  border:2px solid var(--navy);border-radius:14px;display:grid;place-items:center;padding:9px
}
.qr-settings-box img,.qr-settings-box canvas{max-width:100%!important;max-height:100%!important}
.qr-url{font-size:10px;color:#63766b;overflow-wrap:anywhere}
.back-btn{
  border:3px solid var(--navy);background:#fff;color:var(--navy);
  border-radius:12px;padding:10px 14px;font-weight:900;cursor:pointer
}
@media(max-width:650px){.qr-grid{grid-template-columns:1fr}}


.team-x2{height:17px;font-size:11px;font-weight:1000;color:#9b5a12;margin-bottom:1px}
.revealed-answer{
  margin-top:14px;background:#fff1b8;border:3px solid var(--navy);
  border-radius:13px;padding:11px 15px;text-align:center;
  font-size:clamp(16px,1.25vw,20px);font-weight:900;
  box-shadow:0 4px 0 rgba(24,56,76,.20)
}


.answered-marker{
  margin-top:10px;background:#bcebb4;border:3px solid var(--navy);
  border-radius:13px;padding:9px 14px;text-align:center;
  font-size:clamp(14px,1vw,17px);font-weight:900
}

.game-x2-badge{
  position:absolute;left:24px;top:-34px;
  background:#ffe277;border:3px solid var(--navy);border-radius:11px;
  padding:8px 12px;font-weight:1000;font-size:14px;
  box-shadow:0 4px 0 rgba(24,56,76,.18)
}

/* تقدم الفقرات */
.stars{
  display:flex;
  direction:rtl;
  align-items:center;
  justify-content:center;
  gap:3px;
  margin:4px 0;
}
.progress-star{
  color:#dfe7ca;
  font-size:clamp(13px,1.15vw,18px);
  line-height:1;
  -webkit-text-stroke:1px rgba(24,56,76,.16);
  transform:scale(.9);
  transition:color .35s ease,transform .35s ease,filter .35s ease;
}
.progress-star.done{
  color:#26b97b;
  transform:scale(1.08);
  filter:drop-shadow(0 2px 2px rgba(24,56,76,.18));
  animation:starPop .55s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes starPop{
  0%{transform:scale(.55) rotate(-18deg);opacity:.2}
  70%{transform:scale(1.22) rotate(7deg);opacity:1}
  100%{transform:scale(1.08) rotate(0)}
}

/* شاشة بداية الفقرة */
.paragraph-intro{
  position:fixed;
  inset:0;
  z-index:90;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 18% 28%,rgba(255,222,145,.45),transparent 34%),
    radial-gradient(circle at 80% 22%,rgba(112,209,239,.18),transparent 28%),
    rgba(244,247,232,.985);
  overflow:hidden;
}
.paragraph-intro.hidden{display:none!important}
.paragraph-intro-card{
  text-align:center;
  padding:34px 42px;
  animation:introCardIn .72s cubic-bezier(.18,.82,.22,1) both;
}
.paragraph-intro-kicker{
  color:#667d68;
  font-size:clamp(16px,1.4vw,23px);
  font-weight:900;
  margin-bottom:12px;
  animation:introFade .7s .08s ease both;
}
.paragraph-intro-title{
  color:#179aa5;
  font-size:clamp(54px,7vw,112px);
  font-weight:1000;
  line-height:1;
  letter-spacing:-3px;
  text-shadow:0 5px 0 rgba(24,56,76,.10);
  animation:introTitle 2.1s .1s ease-in-out both;
}
.paragraph-intro.leaving{
  animation:introOut .42s ease forwards;
}
@keyframes introCardIn{
  from{opacity:0;transform:translateY(32px) scale(.92)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
@keyframes introFade{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes introTitle{
  0%{opacity:0;transform:translateY(24px) scale(.9)}
  35%{opacity:1;transform:translateY(0) scale(1.04)}
  75%{transform:translateY(-5px) scale(1)}
  100%{transform:translateY(0) scale(1)}
}
@keyframes introOut{
  to{opacity:0;transform:scale(1.025)}
}

/* حركة خفيفة بدون تغيير المقاسات */
.scoreboard,.card{
  animation:softEnter .45s ease both;
}
.question,.free,.answer,.revealed-answer,.answered-marker{
  animation:itemEnter .38s ease both;
}
.answer:nth-child(2){animation-delay:.04s}
.answer:nth-child(3){animation-delay:.08s}
.answer:nth-child(4){animation-delay:.12s}
@keyframes softEnter{
  from{opacity:0;transform:translateY(-6px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes itemEnter{
  from{opacity:0;transform:translateY(8px) scale(.985)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

</style>
</head>
<body>
<div class="shell">
  <header class="scoreboard">
    <section class="team left">
      <div id="team2Name" class="team-name">الفريق الثاني</div><div id="team2X2" class="team-x2"></div>
      <div id="team2Score" class="team-score">0</div>
    </section>
    <section class="center">
      <div class="logo-mini">من<br>أنا</div>
      <div id="progressStars" class="stars" aria-label="تقدم الفقرات">
        <span class="progress-star" data-step="3">★</span>
        <span class="progress-star" data-step="2">★</span>
        <span class="progress-star" data-step="1">★</span>
      </div>
      <button id="optionsBtn" class="options">▼ الخيارات</button>
    </section>
    <section class="team right">
      <div id="team1Name" class="team-name">الفريق الأول</div><div id="team1X2" class="team-x2"></div>
      <div id="team1Score" class="team-score">0</div>
    </section>
  </header>

  <main class="stage">
    <section class="card">
      <div class="qnum">السؤال <span id="qnum">1</span> — <span id="gamePoints">0</span> نقاط</div>
      <div id="tag" class="tag blue">من القائل؟</div>
      <div id="gameX2Badge" class="game-x2-badge hidden"></div>

      <div id="mcqView">
        <div class="question">
          <div class="pause">Ⅱ</div>
          <div id="questionText">بانتظار المقدم لبدء السؤال.</div>
        </div>
        <div id="answers" class="answers"></div>
      </div>

      <div id="freeView" class="hidden">
        <div id="freeText" class="free">بانتظار المقدم لبدء السؤال.</div>
      </div>

      <div id="revealedAnswer" class="revealed-answer hidden">
        <span>الإجابة:</span> <strong id="revealedAnswerText"></strong>
      </div>
      <div id="answeredMarker" class="answered-marker hidden"></div>
      <div id="buzzerState" class="buzzer-line">الجرس مغلق</div>
    </section>
  </main>
</div>



<div id="paragraphIntro" class="paragraph-intro hidden" aria-live="polite">
  <div class="paragraph-intro-card">
    <div id="paragraphIntroKicker" class="paragraph-intro-kicker">الفقرة الأولى</div>
    <div id="paragraphIntroTitle" class="paragraph-intro-title">بدون نقاط</div>
  </div>
</div>

<div id="optionsModal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head">
      <h2 id="modalTitle">الخيارات</h2>
      <button id="closeModal" class="close-btn">×</button>
    </div>

    <div id="optionsMenu">
      <button id="settingsBtn" class="menu-btn">⚙ الإعدادات</button>
    </div>

    <div id="settingsView" class="hidden">
      <button id="backOptions" class="back-btn">← رجوع</button>
      <div class="qr-grid" style="margin-top:16px">
        <div class="qr-card">
          <h3>باركود المقدم</h3>
          <div id="settingsHostQr" class="qr-settings-box"></div>
          <div id="settingsHostUrl" class="qr-url"></div>
        </div>
        <div class="qr-card">
          <h3>باركود الجرس</h3>
          <div id="settingsBuzzerQr" class="qr-settings-box"></div>
          <div id="settingsBuzzerUrl" class="qr-url"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script src="./firebase-config.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

const app=initializeApp(window.firebaseConfig);
const db=getDatabase(app);

const team1Name=document.getElementById("team1Name");
const team2Name=document.getElementById("team2Name");
const team1Score=document.getElementById("team1Score");
const team2Score=document.getElementById("team2Score");
const qnum=document.getElementById("qnum");
const mcqView=document.getElementById("mcqView");
const freeView=document.getElementById("freeView");
const freeText=document.getElementById("freeText");
const questionText=document.getElementById("questionText");
const answers=document.getElementById("answers");
const buzzerState=document.getElementById("buzzerState");
const progressStars=[...document.querySelectorAll(".progress-star")];
const paragraphIntro=document.getElementById("paragraphIntro");
const paragraphIntroKicker=document.getElementById("paragraphIntroKicker");
const paragraphIntroTitle=document.getElementById("paragraphIntroTitle");

let lastIntroRound=0;
let introTimer=null;

onValue(ref(db,"mn_ana"),snap=>{
  if(!snap.exists()) return;
  try{
  const s=snap.val();

  // النجوم: تتلون من اليمين بعد إنهاء كل فقرة.
  const completed=Math.max(0,Math.min(3,Number(s.completedSections||0)));
  progressStars.forEach(star=>{
    const step=Number(star.dataset.step||0);
    // data-step 1 هو النجم الأيمن.
    star.classList.toggle("done",step<=completed);
  });

  // شاشة بداية الفقرة تظهر مرة عند دخول كل فقرة لمدة 3 ثوانٍ.
  const currentRound=Number(s.round||1);
  if(currentRound>=1 && currentRound<=3 && currentRound!==lastIntroRound){
    lastIntroRound=currentRound;
    const labels={
      1:["الفقرة الأولى","بدون نقاط"],
      2:["الفقرة الثانية","من أنا؟"],
      3:["الفقرة الثالثة","من القائل؟"]
    };
    const info=labels[currentRound];
    paragraphIntroKicker.textContent=info[0];
    paragraphIntroTitle.textContent=info[1];
    paragraphIntro.classList.remove("hidden","leaving");

    if(introTimer) clearTimeout(introTimer);
    introTimer=setTimeout(()=>{
      paragraphIntro.classList.add("leaving");
      setTimeout(()=>{
        paragraphIntro.classList.add("hidden");
        paragraphIntro.classList.remove("leaving");
      },420);
    },3000);
  }
  const t1=s.teams?.[1]||s.teams?.["1"]||{name:"الفريق الأول",score:0};
  const t2=s.teams?.[2]||s.teams?.["2"]||{name:"الفريق الثاني",score:0};

  team1Name.textContent=t1.name||"الفريق الأول";
  team2Name.textContent=t2.name||"الفريق الثاني";
  team1Score.textContent=t1.score||0;
  team2Score.textContent=t2.score||0;
  document.getElementById("team1X2").textContent=t1.x2Active?"x2 مفعّل":(t1.x2Used?"x2 مستخدم":"");
  document.getElementById("team2X2").textContent=t2.x2Active?"x2 مفعّل":(t2.x2Used?"x2 مستخدم":"");
  qnum.textContent=Math.max(1,(Number(s.qIndex??0)+1));
  document.getElementById("gamePoints").textContent=Number(s.question?.points||0);

  const gx2=document.getElementById("gameX2Badge");
  const qx2=Number(s.question?.x2Team||0);
  if(qx2){
    const xt=s.teams?.[qx2]||s.teams?.[String(qx2)];
    gx2.textContent=`x2 — ${xt?.name||("الفريق "+qx2)}`;
    gx2.classList.remove("hidden");
  }else{
    gx2.classList.add("hidden");
    gx2.textContent="";
  }

  const round=Number(s.round||1);
  const tagEl=document.getElementById("tag");

  if(round===1){
    tagEl.textContent="اقرأ بدون نقاط";
    tagEl.className="tag green";
    mcqView.classList.add("hidden");
    freeView.classList.remove("hidden");
    freeText.textContent=s.question?.text||"بانتظار السؤال";
  }else{
    tagEl.textContent=round===2?"من أنا؟":"من القائل؟";
    tagEl.className="tag blue";
    mcqView.classList.remove("hidden");
    freeView.classList.add("hidden");
    questionText.textContent=s.question?.text||"بانتظار السؤال";

    const choices=s.question?.choices||[];
    const letters=["أ","ب","ج","د"];
    answers.innerHTML=choices.map((x,i)=>`
      <div class="answer">
        <span>${x}</span>
        <span class="letter">${letters[i]||""}</span>
      </div>
    `).join("");
  }

  const revealBox=document.getElementById("revealedAnswer");
  const revealText=document.getElementById("revealedAnswerText");
  if(s.question?.revealed && s.question?.answer){
    revealText.textContent=s.question.answer;
    revealBox.classList.remove("hidden");
  }else{
    revealBox.classList.add("hidden");
    revealText.textContent="";
  }

  const answeredMarker=document.getElementById("answeredMarker");
  if(s.question?.answeredTeam){
    const t=s.teams?.[s.question.answeredTeam]||s.teams?.[String(s.question.answeredTeam)];
    answeredMarker.textContent=`جابها: ${t?.name||"الفريق"}${s.question.answeredByName?(" — "+s.question.answeredByName):""} — +${Number(s.question.awardedPoints||0)} نقطة`;
    answeredMarker.classList.remove("hidden");
  }else{
    answeredMarker.classList.add("hidden");
    answeredMarker.textContent="";
  }

  const bz=s.buzzer||{open:false,winner:null};
  buzzerState.className="buzzer-line";
  if(bz.winner){
    const wt=s.teams?.[bz.winner]||s.teams?.[String(bz.winner)];
    buzzerState.textContent="الأسرع: "+(wt?.name||"أحد الفرق");
    buzzerState.classList.add("win");
  }else if(bz.open){
    buzzerState.textContent="الجرس مفتوح";
    buzzerState.classList.add("open");
  }else{
    buzzerState.textContent="الجرس مغلق";
  }
  }catch(e){
    console.error("Game render error",e);
  }
});

const optionsModal = document.getElementById("optionsModal");
const optionsMenu = document.getElementById("optionsMenu");
const settingsView = document.getElementById("settingsView");
const modalTitle = document.getElementById("modalTitle");

const baseRoot = location.origin + location.pathname.replace(/\/[^/]*$/, "/");
const settingsHostLink = new URL("host.html", baseRoot).href;
const settingsBuzzerLink = new URL("buzzer.html", baseRoot).href;

function renderSettingsQr(){
  const h = document.getElementById("settingsHostQr");
  const b = document.getElementById("settingsBuzzerQr");
  h.innerHTML=""; b.innerHTML="";
  if(window.QRCode){
    new QRCode(h,{text:settingsHostLink,width:165,height:165,correctLevel:QRCode.CorrectLevel.M});
    new QRCode(b,{text:settingsBuzzerLink,width:165,height:165,correctLevel:QRCode.CorrectLevel.M});
  }
  document.getElementById("settingsHostUrl").textContent=settingsHostLink;
  document.getElementById("settingsBuzzerUrl").textContent=settingsBuzzerLink;
}

document.getElementById("optionsBtn").addEventListener("click",()=>{
  optionsMenu.classList.remove("hidden");
  settingsView.classList.add("hidden");
  modalTitle.textContent="الخيارات";
  optionsModal.classList.remove("hidden");
});
document.getElementById("closeModal").addEventListener("click",()=>optionsModal.classList.add("hidden"));
optionsModal.addEventListener("click",(e)=>{if(e.target===optionsModal)optionsModal.classList.add("hidden")});
document.getElementById("settingsBtn").addEventListener("click",()=>{
  optionsMenu.classList.add("hidden");
  settingsView.classList.remove("hidden");
  modalTitle.textContent="الإعدادات";
  renderSettingsQr();
});
document.getElementById("backOptions").addEventListener("click",()=>{
  settingsView.classList.add("hidden");
  optionsMenu.classList.remove("hidden");
  modalTitle.textContent="الخيارات";
});

</script>
</body>
</html>
