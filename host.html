<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>من أنا؟ — المقدم</title>
<style>
:root{
  --ink:#18384c;
  --bg:#f1f7e3;
  --dot:#dbe9c8;
  --panel:#e9f8cf;
  --team1:#bfd5b9;
  --team2:#cfedda;
  --green:#57cd78;
  --blue:#6ed3ef;
  --orange:#ff7d31;
  --white:#fffefa;
  --red:#ef6c62;
  --shadow:#b7c6a8;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Tahoma,"Segoe UI",Arial,sans-serif;color:var(--ink)}
body{
  background-color:var(--bg);
  background-image:radial-gradient(circle,var(--dot) 2px,transparent 2.2px);
  background-size:16px 16px;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.wrap{max-width:1000px;margin:auto;padding:24px 16px 50px}
.logo{text-align:center;font-size:58px;font-weight:1000;line-height:.9;margin:10px 0 28px}
.card{
  background:rgba(234,249,208,.96);
  border:4px solid var(--ink);
  border-radius:16px;
  box-shadow:0 7px 0 var(--shadow);
  padding:20px;
  margin-bottom:18px;
}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.input{
  width:100%;background:#fff;border:3px solid var(--ink);border-radius:12px;
  padding:12px 14px;color:var(--ink);font-weight:800;outline:none
}
.label{display:block;font-weight:900;margin-bottom:7px}
.btn{
  border:3px solid var(--ink);border-radius:13px;padding:12px 15px;font-weight:900;
  background:#fff;color:var(--ink);box-shadow:0 4px 0 #9fac9e
}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #9fac9e}
.btn.green{background:var(--green)}
.btn.blue{background:var(--blue)}
.btn.orange{background:var(--orange)}
.btn.red{background:#f2a29b}
.btn.dark{background:var(--ink);color:#fff}
.btn.full{width:100%}
.muted{color:#627a68}
.badge{
  display:inline-block;background:var(--ink);color:#fff;border-radius:999px;padding:7px 12px;font-weight:900
}
.scorebar{display:grid;grid-template-columns:1fr 110px 1fr;border:4px solid var(--ink);border-radius:16px;overflow:hidden;margin-bottom:18px}
.teamBox{padding:15px;text-align:center;font-weight:900}
.teamBox.t1{background:var(--team1)} .teamBox.t2{background:var(--team2)}
.teamName{font-size:18px}.score{font-size:46px;line-height:1}
.centerBox{display:grid;place-items:center;background:#edf7cf;border-left:2px solid #9ab59a;border-right:2px solid #9ab59a;font-weight:1000}
.status{
  border:3px solid var(--ink);border-radius:14px;background:#fff;padding:14px;text-align:center;font-weight:900
}
.question{
  border:4px solid var(--ink);border-radius:16px;background:#f7f8e8;
  padding:22px;text-align:center;font-size:24px;line-height:1.65;font-weight:900;
  box-shadow:0 5px 0 #9faa9b
}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.answer{background:#fff;border:3px solid var(--ink);border-radius:12px;padding:12px;font-weight:900}
.controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.small{font-size:13px}
@media(max-width:700px){
  .grid2,.grid3,.answers{grid-template-columns:1fr}
  .scorebar{grid-template-columns:1fr 82px 1fr}
  .teamName{font-size:14px}.score{font-size:38px}
  .logo{font-size:44px}
}

.hostHeader{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.roundTabs{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}
.roundBtn.active{background:var(--blue)}
.winner{font-size:28px}
.x2.used{opacity:.45}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">من أنا؟<div class="small muted" style="margin-top:8px">واجهة المقدم</div></div>

  <div class="scorebar">
    <div class="teamBox t2"><div id="team2Name" class="teamName">الفريق الثاني</div><div id="team2Score" class="score">0</div></div>
    <div class="centerBox">★</div>
    <div class="teamBox t1"><div id="team1Name" class="teamName">الفريق الأول</div><div id="team1Score" class="score">0</div></div>
  </div>

  <div class="card">
    <div class="hostHeader">
      <span class="badge">إعداد الفرق</span>
      <span id="connection" class="small muted">جاري الاتصال…</span>
    </div>
    <div class="grid2">
      <div><label class="label">الفريق الأول</label><input id="t1" class="input" value="الفريق الأول"></div>
      <div><label class="label">الفريق الثاني</label><input id="t2" class="input" value="الفريق الثاني"></div>
    </div>
    <div class="controls">
      <button class="btn green" onclick="saveTeams()">حفظ الأسماء</button>
      <button class="btn red" onclick="resetGame()">تصفير اللعبة</button>
    </div>
  </div>

  <div class="card">
    <span class="badge">الجولة</span>
    <div class="roundTabs">
      <button id="r1" class="btn roundBtn" onclick="setRound(1)">1 — بدون نقاط</button>
      <button id="r2" class="btn roundBtn" onclick="setRound(2)">2 — من أنا؟</button>
      <button id="r3" class="btn roundBtn" onclick="setRound(3)">3 — من القائل؟</button>
    </div>
  </div>

  <div class="card">
    <div id="roundTitle" class="badge">الجولة الأولى</div>
    <div id="questionText" class="question" style="margin-top:14px">اضغط "السؤال التالي" لبدء الجولة.</div>
    <div id="answers" class="answers"></div>
    <div class="controls">
      <button class="btn blue" onclick="nextQuestion()">السؤال التالي</button>
      <button class="btn" onclick="showAnswer()">إظهار الإجابة</button>
    </div>
  </div>

  <div class="card">
    <div class="hostHeader">
      <span class="badge">الجرس</span>
      <span id="buzzerState" class="small muted">مغلق</span>
    </div>
    <div id="winnerBox" class="status winner">لا يوجد ضغط بعد</div>
    <div class="controls">
      <button class="btn green" onclick="openBuzzer()">فتح الجرس</button>
      <button class="btn orange" onclick="closeBuzzer()">إغلاق الجرس</button>
      <button class="btn" onclick="resetBuzzer()">إعادة ضبط الجرس</button>
    </div>
  </div>

  <div class="card">
    <span class="badge">النقاط</span>
    <div class="grid2" style="margin-top:14px">
      <div class="status">
        <strong id="p1label">الفريق الأول</strong>
        <div class="controls" style="justify-content:center">
          <button class="btn green" onclick="addPoints(1,1)">+1</button>
          <button class="btn blue" onclick="addPoints(1,2)">+2</button>
          <button class="btn red" onclick="addPoints(1,-1)">-1</button>
        </div>
        <button id="x21" class="btn orange full x2" onclick="activateX2(1)">تفعيل x2</button>
      </div>
      <div class="status">
        <strong id="p2label">الفريق الثاني</strong>
        <div class="controls" style="justify-content:center">
          <button class="btn green" onclick="addPoints(2,1)">+1</button>
          <button class="btn blue" onclick="addPoints(2,2)">+2</button>
          <button class="btn red" onclick="addPoints(2,-1)">-1</button>
        </div>
        <button id="x22" class="btn orange full x2" onclick="activateX2(2)">تفعيل x2</button>
      </div>
    </div>
  </div>
</div>

<script src="./firebase-config.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getDatabase, ref, set, update, onValue, get } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

const app = initializeApp(window.firebaseConfig);
const db = getDatabase(app);
const gameRef = ref(db, "mn_ana");

const rounds = {
  1: [
    {q:"من أجمل ملامح الإنسان ... ؟", a:"ابتسامته"},
    {q:"شيء يبدأ بحرف م وينتهي بحرف ة ... ؟", a:"معلومة"},
    {q:"اسم بلد عربي إذا حذفت نقاطه تغيّر شكله تمامًا ... ؟", a:"تحدي مفتوح"}
  ],
  2: [
    {q:"أنا لاعب كرة قدم عربي، لعبت في الدوري الإنجليزي، ومن أشهر نجوم ليفربول. من أنا؟", a:"محمد صلاح"},
    {q:"أنا عالم فيزياء اشتهرت بالنسبية ومعادلة E=mc². من أنا؟", a:"ألبرت أينشتاين"},
    {q:"أنا شخصية خيالية أرتدي عباءة سوداء وشعاري الخفاش. من أنا؟", a:"باتمان"}
  ],
  3: [
    {q:"الجهل يؤدي إلى الخوف، والخوف يؤدي إلى الكره، والكره يؤدي إلى العنف.", a:"ابن رشد", choices:["ابن رشد","ابن سينا","الكندي","الفارابي"]},
    {q:"الحياة مثل ركوب الدراجة، لتحافظ على توازنك يجب أن تستمر في الحركة.", a:"ألبرت أينشتاين", choices:["ألبرت أينشتاين","نيوتن","تسلا","داروين"]}
  ]
};

let state = {
  teams: {1:{name:"الفريق الأول",score:0,x2Used:false,x2Active:false},2:{name:"الفريق الثاني",score:0,x2Used:false,x2Active:false}},
  round:1, qIndex:-1,
  question:{text:"اضغط «السؤال التالي» لبدء الجولة.",answer:"",choices:[]},
  buzzer:{open:false,winner:null,pressedAt:null}
};

onValue(gameRef, snap => {
  document.getElementById("connection").textContent = "متصل";
  if(!snap.exists()){
    set(gameRef,state);
    return;
  }
  state = Object.assign(state,snap.val());
  render();
}, err => {
  document.getElementById("connection").textContent = "تعذر الاتصال";
  console.error(err);
});

function render(){
  const t1=state.teams?.[1]||state.teams?.["1"];
  const t2=state.teams?.[2]||state.teams?.["2"];
  if(!t1||!t2) return;
  team1Name.textContent=t1.name; team2Name.textContent=t2.name;
  team1Score.textContent=t1.score||0; team2Score.textContent=t2.score||0;
  p1label.textContent=t1.name; p2label.textContent=t2.name;
  t1InputValue(t1.name); t2InputValue(t2.name);
  questionText.textContent=state.question?.text||"";
  roundTitle.textContent=state.round===1?"الجولة الأولى — بدون نقاط":state.round===2?"الجولة الثانية — من أنا؟":"الجولة الثالثة — من القائل؟";
  [1,2,3].forEach(n=>document.getElementById("r"+n).classList.toggle("active",n===Number(state.round)));
  const choices=state.question?.choices||[];
  answers.innerHTML=choices.map(x=>`<div class="answer">${x}</div>`).join("");
  const bz=state.buzzer||{};
  buzzerState.textContent=bz.open?"مفتوح":"مغلق";
  if(bz.winner){
    const wt=(state.teams?.[bz.winner]||state.teams?.[String(bz.winner)]);
    winnerBox.textContent="الأسرع: "+(wt?.name||("فريق "+bz.winner));
    winnerBox.style.background="#bcebb4";
  } else {
    winnerBox.textContent=bz.open?"الجرس مفتوح — بانتظار أول ضغطة":"لا يوجد ضغط بعد";
    winnerBox.style.background="#fff";
  }
  setX2Button(1,t1); setX2Button(2,t2);
}
function t1InputValue(v){ if(document.activeElement!==document.getElementById("t1")) document.getElementById("t1").value=v; }
function t2InputValue(v){ if(document.activeElement!==document.getElementById("t2")) document.getElementById("t2").value=v; }
function setX2Button(n,t){
  const b=document.getElementById("x2"+n);
  b.disabled=!!t.x2Used;
  b.classList.toggle("used",!!t.x2Used);
  b.textContent=t.x2Used?"تم استخدام x2":(t.x2Active?"x2 مفعّل":"تفعيل x2");
}

window.saveTeams=()=>update(gameRef,{"teams/1/name":document.getElementById("t1").value.trim()||"الفريق الأول","teams/2/name":document.getElementById("t2").value.trim()||"الفريق الثاني"});
window.setRound=(n)=>update(gameRef,{round:n,qIndex:-1,question:{text:"اضغط «السؤال التالي» لبدء الجولة.",answer:"",choices:[]}});
window.nextQuestion=async()=>{
  const n=Number(state.round||1), list=rounds[n], idx=((state.qIndex??-1)+1)%list.length, item=list[idx];
  await update(gameRef,{qIndex:idx,question:{text:item.q,answer:item.a,choices:item.choices||[]},"buzzer/open":false,"buzzer/winner":null,"buzzer/pressedAt":null});
};
window.showAnswer=()=>alert(state.question?.answer||"لا توجد إجابة مسجلة");
window.openBuzzer=()=>set(ref(db,"mn_ana/buzzer"),{open:true,winner:null,pressedAt:null});
window.closeBuzzer=()=>update(ref(db,"mn_ana/buzzer"),{open:false});
window.resetBuzzer=()=>set(ref(db,"mn_ana/buzzer"),{open:false,winner:null,pressedAt:null});
window.addPoints=async(team,delta)=>{
  const t=state.teams?.[team]||state.teams?.[String(team)];
  let amount=delta;
  if(delta>0 && t?.x2Active){
    amount=delta*2;
    await update(gameRef,{[`teams/${team}/x2Active`]:false,[`teams/${team}/x2Used`]:true});
  }
  const next=Math.max(0,Number(t?.score||0)+amount);
  await update(gameRef,{[`teams/${team}/score`]:next});
};
window.activateX2=async(team)=>{
  const t=state.teams?.[team]||state.teams?.[String(team)];
  if(t?.x2Used) return;
  await update(gameRef,{[`teams/${team}/x2Active`]:!t?.x2Active});
};
window.resetGame=()=>{
  if(!confirm("تصفير النقاط والجرس وإعادة اللعبة؟"))return;
  set(gameRef,{
    teams:{1:{name:state.teams?.[1]?.name||state.teams?.["1"]?.name||"الفريق الأول",score:0,x2Used:false,x2Active:false},
            2:{name:state.teams?.[2]?.name||state.teams?.["2"]?.name||"الفريق الثاني",score:0,x2Used:false,x2Active:false}},
    round:1,qIndex:-1,question:{text:"اضغط «السؤال التالي» لبدء الجولة.",answer:"",choices:[]},
    buzzer:{open:false,winner:null,pressedAt:null}
  });
};
</script>
</body>
</html>
