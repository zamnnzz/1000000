<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>إدارة نشاط الزوار | زامن</title>
<script>if(sessionStorage.getItem("zamnAdminGate")!=="19400"){location.replace("/");}</script>
<style>
:root{font-family:Tajawal,system-ui,-apple-system,sans-serif;color:#2f1457;background:#f5f1ff}*{box-sizing:border-box}body{margin:0;padding:24px}.wrap{max-width:1100px;margin:auto}.card{background:#fff;border:1px solid #eadcff;border-radius:18px;padding:18px;box-shadow:0 10px 30px rgba(80,30,120,.08);margin-bottom:16px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}input,button,select{font:inherit;border-radius:12px;padding:11px 13px;border:1px solid #d8c7f3}input{flex:1;min-width:220px}button{background:#6d28d9;color:#fff;border:0;font-weight:800;cursor:pointer}.muted{color:#6b7280}.hidden{display:none}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.stat{background:#faf8ff;border-radius:14px;padding:14px}.stat b{display:block;font-size:24px}.sessions{display:grid;gap:10px}.session{border:1px solid #eee3ff;border-radius:14px;padding:13px;background:#fff}.events{margin-top:10px;padding-right:18px;display:grid;gap:7px}.event{border-right:3px solid #c4b5fd;padding-right:10px}.event small{color:#6b7280}.warn{background:#fff7ed;color:#9a3412;border-color:#fed7aa}code{direction:ltr;display:inline-block}

.replay-modal{position:fixed;inset:0;background:rgba(18,7,33,.72);z-index:99999;display:flex;align-items:center;justify-content:center;padding:18px}.replay-modal.hidden{display:none}.replay-box{width:min(1100px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:18px;padding:14px}.replay-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.replay-target{min-height:420px;direction:ltr}.replay-btn{margin-top:10px} 
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/rrweb-player@latest/dist/style.css">
</head>
<body>
<div class="wrap">
  <h1>نشاط الزوار</h1>
  <div class="card warn">تعرض هذه الصفحة مسار الجلسات والضغطات وإعادة الجلسة المرئية. حقول الإدخال تبقى محجوبة من التسجيل.</div>
  <section id="dashboard">
    <div class="row" style="justify-content:space-between"><div><h2>آخر الجلسات</h2><p class="muted">تحديث مباشر من Firebase</p></div><button id="logout">خروج</button></div>
    <div class="card stats"><div class="stat"><span>الجلسات المعروضة</span><b id="sessionCount">0</b></div><div class="stat"><span>الضغطات</span><b id="clickCount">0</b></div><div class="stat"><span>مشاهدات الصفحات</span><b id="pageCount">0</b></div></div>
    <div class="card"><div class="row"><label>عدد الجلسات <select id="limit"><option>20</option><option>50</option><option>100</option></select></label><button id="refresh">تحديث</button></div></div>
    <div id="sessions" class="sessions"></div>
  </section>
</div>
<div id="replayModal" class="replay-modal hidden" role="dialog" aria-modal="true">
  <div class="replay-box">
    <div class="replay-head"><strong>إعادة الجلسة</strong><button id="closeReplay" type="button">إغلاق</button></div>
    <div id="replayTarget" class="replay-target"></div>
  </div>
</div>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="/js/games.js"></script>
<script src="https://cdn.jsdelivr.net/npm/rrweb-player@latest/dist/index.js"></script>
<script>
(function(){
  const cfg=window.ZAMN_FIREBASE_CONFIG||{};
  if(!firebase.apps.length) firebase.initializeApp(cfg);
  const db=firebase.database();
  const $=id=>document.getElementById(id);
  const fmt=t=>t?new Date(t).toLocaleString('ar-SA'):'';
  function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  let activePlayer=null;
  async function openReplay(sessionId){
    try{
      const snap=await db.ref('analytics/sessionEvents/'+sessionId).get();
      const chunks=Object.values(snap.val()||{}).filter(x=>x && x.type==='__replay');
      const events=chunks.sort((a,b)=>(a.at||0)-(b.at||0)).flatMap(c=>Array.isArray(c.events)?c.events:[]);
      if(!events.length){alert('لا يوجد تسجيل محفوظ لهذه الجلسة حتى الآن. افتح جلسة جديدة وانتظر عدة ثوانٍ ثم حدّث الإدارة.');return;}
      $('replayTarget').innerHTML=''; $('replayModal').classList.remove('hidden');
      if(typeof rrwebPlayer!=='function'){alert('تعذر تحميل مشغل التسجيل.');return;}
      activePlayer=new rrwebPlayer({target:$('replayTarget'),props:{events,width:Math.min(980,window.innerWidth-70),autoPlay:true,showController:true}});
    }catch(e){alert('تعذر تحميل التسجيل: '+(e.message||e));}
  }
  async function load(){
    const lim=Number($('limit').value)||20;
    const snap=await db.ref('analytics/sessionEvents').limitToLast(lim).get();
    const data=snap.val()||{};
    const sessions=Object.entries(data).map(([id,eventsObj])=>{
      const all=Object.values(eventsObj||{}).sort((a,b)=>(a.at||0)-(b.at||0));
      const events=all.filter(e=>e && e.type!=='__replay');
      const replayCount=all.filter(e=>e && e.type==='__replay').length;
      const label=[...all].reverse().find(e=>e && e.userLabel && e.userLabel!=='زائر')?.userLabel || 'زائر';
      return {id,events,replayCount,label,last:all.at(-1)?.at||0};
    }).sort((a,b)=>b.last-a.last);
    let clicks=0,pages=0;
    $('sessions').innerHTML=sessions.map(s=>{
      s.events.forEach(e=>{if(e.type==='click')clicks++; if(e.type==='pageview')pages++;});
      const first=s.events[0]||{};
      return `<article class="session"><div><b>جلسة ${esc(s.id.slice(-8))}</b> <span class="muted">${esc(fmt(s.last))}</span></div><div class="muted"><b>${s.label==='زائر'?'زائر':'رقم الجوال: '+esc(s.label)}</b> · المعرّف: ${esc((first.visitorId||'').slice(-10))}</div><button class="replay-btn" type="button" data-replay-session="${esc(s.id)}">▶ مشاهدة الجلسة${s.replayCount?'':' (قيد الحفظ)'}</button><div class="events">${s.events.map(e=>`<div class="event"><b>${esc(e.type==='click'?'ضغطة':e.type==='pageview'?'فتح صفحة':'تنقل')}</b> — ${esc(e.path||'')} ${e.target?`<br><small>${esc(e.target)}</small>`:''}<br><small>${esc(fmt(e.at))} ${esc(e.viewport||'')}</small></div>`).join('')}</div></article>`;
    }).join('') || '<div class="card muted">لا توجد بيانات جلسات حتى الآن.</div>';
    $('sessionCount').textContent=sessions.length; $('clickCount').textContent=clicks; $('pageCount').textContent=pages;
  }
  $('logout').onclick=()=>{sessionStorage.removeItem('zamnAdminGate');location.href='/';}; $('refresh').onclick=()=>load().catch(e=>alert(e.message||e));
  $('sessions').addEventListener('click',e=>{const b=e.target.closest('[data-replay-session]');if(b)openReplay(b.dataset.replaySession);});
  $('closeReplay').onclick=()=>{$('replayModal').classList.add('hidden');$('replayTarget').innerHTML='';activePlayer=null;};
  $('replayModal').addEventListener('click',e=>{if(e.target===$('replayModal'))$('closeReplay').click();});
  load().catch(e=>alert('تعذر قراءة analytics من Firebase: '+(e.message||e)));
})();
</script>
</body>
</html>
