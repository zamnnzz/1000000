<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>إدارة نشاط الزوار | زامن</title>
<script>if(sessionStorage.getItem("zamnAdminGate")!=="19400"){location.replace("/");}</script>
<style>
:root{font-family:Tajawal,system-ui,-apple-system,sans-serif;color:#2f1457;background:#f5f1ff}*{box-sizing:border-box}body{margin:0;padding:24px}.wrap{max-width:1100px;margin:auto}.card{background:#fff;border:1px solid #eadcff;border-radius:18px;padding:18px;box-shadow:0 10px 30px rgba(80,30,120,.08);margin-bottom:16px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}input,button,select{font:inherit;border-radius:12px;padding:11px 13px;border:1px solid #d8c7f3}input{flex:1;min-width:220px}button{background:#6d28d9;color:#fff;border:0;font-weight:800;cursor:pointer}.muted{color:#6b7280}.hidden{display:none}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.stat{background:#faf8ff;border-radius:14px;padding:14px}.stat b{display:block;font-size:24px}.sessions{display:grid;gap:14px}.user-card{border:1px solid #dfd1f7;border-radius:16px;padding:15px;background:#fff}.user-head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.recordings{display:grid;gap:8px;margin-top:12px}.recording{border:1px solid #eee3ff;border-radius:12px;padding:11px;background:#faf8ff;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.session{border:1px solid #eee3ff;border-radius:14px;padding:13px;background:#fff}.events{margin-top:10px;padding-right:18px;display:grid;gap:7px}.event{border-right:3px solid #c4b5fd;padding-right:10px}.event small{color:#6b7280}.warn{background:#fff7ed;color:#9a3412;border-color:#fed7aa}code{direction:ltr;display:inline-block}

.replay-modal{position:fixed;inset:0;background:rgba(18,7,33,.72);z-index:99999;display:flex;align-items:center;justify-content:center;padding:18px}.replay-modal.hidden{display:none}.replay-box{width:min(1100px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:18px;padding:14px}.replay-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.replay-target{min-height:420px;direction:ltr}.replay-btn{margin-top:10px} 
</style>
<link rel="stylesheet" href="https://cdn.rrweb.com/rrweb-player/2.1.1/style.css">
</head>
<body>
<div class="wrap">
  <h1>نشاط الزوار</h1>
  <div class="card warn">تعرض هذه الصفحة مسار الجلسات والضغطات وإعادة الجلسة المرئية. حقول الإدخال تبقى محجوبة من التسجيل.</div>
  <section id="dashboard">
    <div class="row" style="justify-content:space-between"><div><h2>آخر الجلسات</h2><p class="muted">تحديث مباشر من Firebase</p></div><button id="logout">خروج</button></div>
    <div class="card stats"><div class="stat"><span>الجلسات المعروضة</span><b id="sessionCount">0</b></div><div class="stat"><span>الضغطات</span><b id="clickCount">0</b></div><div class="stat"><span>مشاهدات الصفحات</span><b id="pageCount">0</b></div></div>
    <div class="card"><div class="row"><label>عدد الجلسات <select id="limit"><option>20</option><option>50</option><option>100</option></select></label><button id="refresh">تحديث</button></div></div>
    <div id="sessions" class="sessions"></div>
  </section>
</div>
<div id="replayModal" class="replay-modal hidden" role="dialog" aria-modal="true">
  <div class="replay-box">
    <div class="replay-head"><strong>إعادة الجلسة</strong><button id="closeReplay" type="button">إغلاق</button></div>
    <div id="replayTarget" class="replay-target"></div>
  </div>
</div>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="/js/games.js"></script>
<script src="https://cdn.rrweb.com/rrweb-player/2.1.1/rrweb-player.umd.cjs"></script>
<script>
(function(){
  const cfg=window.ZAMN_FIREBASE_CONFIG||{};
  if(!firebase.apps.length) firebase.initializeApp(cfg);
  const db=firebase.database();
  const $=id=>document.getElementById(id);
  const fmt=t=>t?new Date(t).toLocaleString('ar-SA'):'';
  function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  let activePlayer=null;

  function replayKey(e,sessionId){
    return e?.replaySegmentId || ('legacy_'+sessionId);
  }
  function replayIdentity(e){
    if(e?.userKey) return {key:e.userKey,label:e.userLabel||'زائر'};
    if(e?.userLabel && e.userLabel!=='زائر') return {key:'phone_'+String(e.userLabel).replace(/^\+/,''),label:e.userLabel};
    return {key:'visitor_'+(e?.visitorId||'unknown'),label:'زائر'};
  }

  async function openReplay(sessionId,segmentId){
    try{
      const snap=await db.ref('analytics/sessionEvents/'+sessionId).get();
      const chunks=Object.values(snap.val()||{}).filter(x=>x && x.type==='__replay' && replayKey(x,sessionId)===segmentId);
      const events=chunks.sort((a,b)=>(a.at||0)-(b.at||0)).flatMap(c=>{
        if(Array.isArray(c.events)) return c.events; // legacy recordings
        if(typeof c.eventsJson==='string'){
          try{ const parsed=JSON.parse(c.eventsJson); return Array.isArray(parsed)?parsed:[]; }
          catch(e){ console.warn('replay parse failed',e); return []; }
        }
        return [];
      }).sort((a,b)=>(a.timestamp||0)-(b.timestamp||0));
      if(!events.length){alert('لا يوجد تسجيل محفوظ لهذا الجزء.');return;}
      $('replayTarget').innerHTML=''; $('replayModal').classList.remove('hidden');
      if(typeof rrwebPlayer!=='function'){alert('تعذر تحميل مشغل التسجيل.');return;}
      activePlayer=new rrwebPlayer({target:$('replayTarget'),props:{events,width:Math.min(980,window.innerWidth-70),autoPlay:true,showController:true}});
    }catch(e){alert('تعذر تحميل التسجيل: '+(e.message||e));}
  }

  async function load(){
    const lim=Number($('limit').value)||20;
    const snap=await db.ref('analytics/sessionEvents').limitToLast(lim).get();
    const data=snap.val()||{};
    const users=new Map();
    let clicks=0,pages=0,sessionCount=0;

    Object.entries(data).forEach(([sessionId,eventsObj])=>{
      sessionCount++;
      const all=Object.values(eventsObj||{}).filter(Boolean).sort((a,b)=>(a.at||0)-(b.at||0));
      all.forEach(e=>{ if(e.type==='click') clicks++; if(e.type==='pageview') pages++; });

      const replayEvents=all.filter(e=>e.type==='__replay');
      const segmentMap=new Map();
      replayEvents.forEach(e=>{
        const identity=replayIdentity(e);
        const segId=replayKey(e,sessionId);
        const mapKey=identity.key+'|'+segId;
        if(!segmentMap.has(mapKey)) segmentMap.set(mapKey,{identity,sessionId,segmentId:segId,chunks:[],start:e.replaySegmentStartedAt||e.at||0,last:e.at||0,path:e.path||''});
        const seg=segmentMap.get(mapKey);
        seg.chunks.push(e); seg.last=Math.max(seg.last,e.at||0); if(e.path) seg.path=e.path;
      });

      // Sessions with no replay still appear under the matching visitor/phone.
      if(!segmentMap.size){
        const label=[...all].reverse().find(e=>e.userLabel && e.userLabel!=='زائر')?.userLabel || 'زائر';
        const visitorId=all.find(e=>e.visitorId)?.visitorId||sessionId;
        const identity=label==='زائر'?{key:'visitor_'+visitorId,label:'زائر'}:{key:'phone_'+label.replace(/^\+/,''),label};
        if(!users.has(identity.key)) users.set(identity.key,{...identity,segments:[],sessions:new Set(),last:0});
        const u=users.get(identity.key); u.sessions.add(sessionId); u.last=Math.max(u.last,all.at(-1)?.at||0);
      }

      segmentMap.forEach(seg=>{
        const {identity}=seg;
        if(!users.has(identity.key)) users.set(identity.key,{...identity,segments:[],sessions:new Set(),last:0});
        const u=users.get(identity.key);
        u.sessions.add(sessionId);
        u.last=Math.max(u.last,seg.last||seg.start||0);
        const rrEvents=seg.chunks.flatMap(c=>Array.isArray(c.events)?c.events:[]);
        const ts=rrEvents.map(e=>Number(e?.timestamp)||0).filter(Boolean).sort((a,b)=>a-b);
        const duration=ts.length>1?Math.min(60,Math.max(1,Math.round((ts.at(-1)-ts[0])/1000))):0;
        u.segments.push({...seg,duration});
      });
    });

    const list=[...users.values()].sort((a,b)=>b.last-a.last);
    $('sessions').innerHTML=list.map(u=>{
      const segs=u.segments.sort((a,b)=>(b.start||0)-(a.start||0));
      const recordings=segs.length?segs.map((r,i)=>`<div class="recording"><div><b>تسجيل ${segs.length-i}</b> <span class="muted">${esc(fmt(r.start||r.last))}</span><br><small class="muted">${r.duration?esc(r.duration+' ثانية'):'أقل من دقيقة'}${r.path?' · '+esc(r.path):''}</small></div><button class="replay-btn" type="button" data-replay-session="${esc(r.sessionId)}" data-replay-segment="${esc(r.segmentId)}">▶ مشاهدة</button></div>`).join(''):'<div class="muted">لا يوجد تسجيل مرئي محفوظ بعد.</div>';
      return `<article class="user-card"><div class="user-head"><div><h3 style="margin:0">${u.label==='زائر'?'زائر':'رقم الجوال: '+esc(u.label)}</h3><small class="muted">${u.sessions.size} جلسة · آخر نشاط ${esc(fmt(u.last))}</small></div><span class="muted">${segs.length} تسجيل</span></div><div class="recordings">${recordings}</div></article>`;
    }).join('') || '<div class="card muted">لا توجد بيانات جلسات حتى الآن.</div>';

    $('sessionCount').textContent=sessionCount; $('clickCount').textContent=clicks; $('pageCount').textContent=pages;
  }

  $('logout').onclick=()=>{sessionStorage.removeItem('zamnAdminGate');location.href='/';};
  $('refresh').onclick=()=>load().catch(e=>alert(e.message||e));
  $('sessions').addEventListener('click',e=>{const b=e.target.closest('[data-replay-session]');if(b)openReplay(b.dataset.replaySession,b.dataset.replaySegment);});
  $('closeReplay').onclick=()=>{$('replayModal').classList.add('hidden');$('replayTarget').innerHTML='';activePlayer=null;};
  $('replayModal').addEventListener('click',e=>{if(e.target===$('replayModal'))$('closeReplay').click();});
  load().catch(e=>alert('تعذر قراءة analytics من Firebase: '+(e.message||e)));
})();
</script>
</body>
</html>
