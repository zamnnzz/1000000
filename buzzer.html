<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>من أنا؟ — الجرس</title>
<style>
:root{
  --ink:#18384c;
  --bg:#f1f7e3;
  --dot:#dbe9c8;
  --panel:#e9f8cf;
  --team1:#bfd5b9;
  --team2:#cfedda;
  --green:#57cd78;
  --blue:#6ed3ef;
  --orange:#ff7d31;
  --white:#fffefa;
  --red:#ef6c62;
  --shadow:#b7c6a8;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Tahoma,"Segoe UI",Arial,sans-serif;color:var(--ink)}
body{
  background-color:var(--bg);
  background-image:radial-gradient(circle,var(--dot) 2px,transparent 2.2px);
  background-size:16px 16px;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.wrap{max-width:1000px;margin:auto;padding:24px 16px 50px}
.logo{text-align:center;font-size:54px;font-weight:1000;line-height:.9;margin:10px 0 28px}
.card{
  background:rgba(234,249,208,.96);
  border:4px solid var(--ink);
  border-radius:18px;
  box-shadow:0 7px 0 var(--shadow);
  padding:20px;
  margin-bottom:18px;
}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.input{
  width:100%;background:#fff;border:3px solid var(--ink);border-radius:12px;
  padding:12px 14px;color:var(--ink);font-weight:800;outline:none
}
.label{display:block;font-weight:900;margin-bottom:7px}
.btn{
  border:3px solid var(--ink);border-radius:13px;padding:12px 15px;font-weight:900;
  background:#fff;color:var(--ink);box-shadow:0 4px 0 #9fac9e
}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #9fac9e}
.btn.green{background:var(--green)}
.btn.blue{background:var(--blue)}
.btn.orange{background:var(--orange)}
.btn.red{background:#f2a29b}
.btn.dark{background:var(--ink);color:#fff}
.btn.full{width:100%}
.muted{color:#627a68}
.badge{
  display:inline-block;background:var(--ink);color:#fff;border-radius:999px;padding:7px 12px;font-weight:900
}
.scorebar{display:grid;grid-template-columns:1fr 110px 1fr;border:4px solid var(--ink);border-radius:18px;overflow:hidden;margin-bottom:18px}
.teamBox{padding:15px;text-align:center;font-weight:900}
.teamBox.t1{background:var(--team1)} .teamBox.t2{background:var(--team2)}
.teamName{font-size:18px}.score{font-size:46px;line-height:1}
.centerBox{display:grid;place-items:center;background:#edf7cf;border-left:2px solid #9ab59a;border-right:2px solid #9ab59a;font-weight:1000}
.status{
  border:3px solid var(--ink);border-radius:14px;background:#fff;padding:14px;text-align:center;font-weight:900
}
.question{
  border:4px solid var(--ink);border-radius:18px;background:#f7f8e8;
  padding:22px;text-align:center;font-size:24px;line-height:1.65;font-weight:900;
  box-shadow:0 5px 0 #9faa9b
}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.answer{background:#fff;border:3px solid var(--ink);border-radius:12px;padding:12px;font-weight:900}
.controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.small{font-size:13px}
@media(max-width:700px){
  .grid2,.grid3,.answers{grid-template-columns:1fr}
  .scorebar{grid-template-columns:1fr 82px 1fr}
  .teamName{font-size:14px}.score{font-size:38px}
  .logo{font-size:44px}
}

body{display:grid;place-items:center;min-height:100vh}
.phone{width:min(480px,100%);padding:20px}
.buzzerCard{text-align:center}
.teamPick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.teamPick button.active{background:var(--blue)}
.bigBuzzer{
  width:min(310px,78vw);aspect-ratio:1;border-radius:50%;border:8px solid var(--ink);
  background:var(--orange);font-size:44px;font-weight:1000;color:var(--ink);
  box-shadow:0 15px 0 #b54e1f,0 26px 40px rgba(24,56,76,.18);
  margin:26px auto;display:grid;place-items:center;transition:.12s
}
.bigBuzzer:active{transform:translateY(8px);box-shadow:0 7px 0 #b54e1f}
.bigBuzzer:disabled{filter:grayscale(.45);opacity:.6;transform:none}
.bigBuzzer.win{background:var(--green);box-shadow:0 15px 0 #2f8850}
.bigBuzzer.lose{background:#c8d0c4;box-shadow:0 15px 0 #889487}
</style>
</head>
<body>
<div class="phone">
  <div class="logo">من أنا؟<div class="small muted" style="margin-top:8px">جرس المتسابق</div></div>
  <div class="card buzzerCard">
    <div class="badge">اختر فريقك</div>
    <div class="teamPick">
      <button id="pick1" class="btn" onclick="chooseTeam(1)">الفريق الأول</button>
      <button id="pick2" class="btn" onclick="chooseTeam(2)">الفريق الثاني</button>
    </div>
    <div id="status" class="status">اختر فريقك أولًا</div>
    <button id="buzz" class="bigBuzzer" onclick="buzzNow()" disabled>جرس</button>
    <div id="connection" class="small muted">جاري الاتصال…</div>
  </div>
</div>

<script src="./firebase-config.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getDatabase, ref, onValue, runTransaction, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

const app=initializeApp(window.firebaseConfig);
const db=getDatabase(app);
let team=Number(localStorage.getItem("mnAnaTeam")||0);
let state=null;

onValue(ref(db,"mn_ana"),snap=>{
  connection.textContent="متصل";
  state=snap.val();
  render();
},err=>{connection.textContent="تعذر الاتصال";console.error(err)});

window.chooseTeam=(n)=>{
  team=n;localStorage.setItem("mnAnaTeam",String(n));render();
};

function render(){
  const t1=state?.teams?.[1]||state?.teams?.["1"];
  const t2=state?.teams?.[2]||state?.teams?.["2"];
  pick1.textContent=t1?.name||"الفريق الأول";
  pick2.textContent=t2?.name||"الفريق الثاني";
  pick1.classList.toggle("active",team===1);pick2.classList.toggle("active",team===2);
  buzz.classList.remove("win","lose");

  if(!team){
    status.textContent="اختر فريقك أولًا";buzz.disabled=true;return;
  }
  const bz=state?.buzzer||{};
  if(bz.winner){
    const wt=state?.teams?.[bz.winner]||state?.teams?.[String(bz.winner)];
    if(Number(bz.winner)===team){
      status.textContent="أنت الأسرع! جاوب الآن";
      buzz.classList.add("win");
    }else{
      status.textContent="سبقك "+(wt?.name||"الفريق الآخر");
      buzz.classList.add("lose");
    }
    buzz.disabled=true;return;
  }
  if(!bz.open){
    status.textContent="الجرس مغلق — انتظر المقدم";
    buzz.disabled=true;return;
  }
  status.textContent="الجرس مفتوح!";
  buzz.disabled=false;
}

window.buzzNow=async()=>{
  if(!team||!state?.buzzer?.open) return;
  buzz.disabled=true;
  const bzRef=ref(db,"mn_ana/buzzer");
  const result=await runTransaction(bzRef,current=>{
    if(!current?.open || current?.winner) return;
    return {open:false,winner:team,pressedAt:Date.now()};
  });
  if(!result.committed) render();
};
render();
</script>
</body>
</html>
