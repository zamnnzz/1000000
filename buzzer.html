<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>من أنا؟ — الجرس</title>
<style>
:root{--ink:#18384c;--bg:#f1f7e3;--dot:#dbe9c8;--panel:#e9f8cf;--green:#57cd78;--blue:#6ed3ef;--orange:#ff7d31;--shadow:#b7c6a8}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Tahoma,"Segoe UI",Arial,sans-serif;color:var(--ink)}
body{background-color:var(--bg);background-image:radial-gradient(circle,var(--dot) 2px,transparent 2.2px);background-size:16px 16px;display:grid;place-items:center}
button{font:inherit;cursor:pointer}
.phone{width:min(480px,100%);padding:20px}.logo{text-align:center;font-size:52px;font-weight:1000;line-height:.9;margin:10px 0 28px}
.small{font-size:13px}.muted{color:#627a68}.card{background:rgba(234,249,208,.96);border:4px solid var(--ink);border-radius:18px;box-shadow:0 7px 0 var(--shadow);padding:20px;text-align:center}
.badge{display:inline-block;background:var(--ink);color:#fff;border-radius:999px;padding:7px 12px;font-weight:900}
.teamPick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}.btn{border:3px solid var(--ink);border-radius:13px;padding:12px 15px;font-weight:900;background:#fff;color:var(--ink);box-shadow:0 4px 0 #9fac9e}.teamPick button.active{background:var(--blue)}
.status{border:3px solid var(--ink);border-radius:14px;background:#fff;padding:13px;text-align:center;font-weight:900}
.bigBuzzer{width:min(300px,76vw);aspect-ratio:1;border-radius:50%;border:8px solid var(--ink);background:var(--orange);font-size:42px;font-weight:1000;color:var(--ink);box-shadow:0 15px 0 #b54e1f,0 26px 40px rgba(24,56,76,.18);margin:24px auto;display:grid;place-items:center;transition:.12s}
.bigBuzzer:active{transform:translateY(8px);box-shadow:0 7px 0 #b54e1f}.bigBuzzer:disabled{filter:grayscale(.45);opacity:.6;transform:none}.bigBuzzer.win{background:var(--green);box-shadow:0 15px 0 #2f8850}.bigBuzzer.lose{background:#c8d0c4;box-shadow:0 15px 0 #889487}
.x2btn{width:100%;margin-top:2px;background:#ffe277;border:3px solid var(--ink);border-radius:14px;padding:14px;font-weight:1000;font-size:18px;box-shadow:0 4px 0 #b79c3d}.x2btn.active{background:#ffb347}.x2btn:disabled{opacity:.55;filter:grayscale(.3)}
.x2hint{font-size:12px;color:#657262;margin:8px 0 2px}
</style>
</head>
<body>
<div class="phone">
  <div class="logo">من أنا؟<div class="small muted" style="margin-top:8px">جرس المتسابق</div></div>
  <div class="card">
    <div class="badge">اختر فريقك</div>
    <div class="teamPick">
      <button id="pick1" class="btn" onclick="chooseTeam(1)">الفريق الأول</button>
      <button id="pick2" class="btn" onclick="chooseTeam(2)">الفريق الثاني</button>
    </div>

    <div id="status" class="status">اختر فريقك أولًا</div>

    <button id="buzz" class="bigBuzzer" onclick="buzzNow()" disabled>جرس</button>

    <button id="x2" class="x2btn" onclick="activateX2()" disabled>مضاعفة النقاط x2</button>
    <div id="x2hint" class="x2hint">لكل فريق استخدام واحد فقط طوال اللعبة.</div>

    <div id="connection" class="small muted" style="margin-top:14px">جاري الاتصال…</div>
  </div>
</div>

<script src="./firebase-config.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getDatabase, ref, onValue, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

const app=initializeApp(window.firebaseConfig);
const db=getDatabase(app);
const el=id=>document.getElementById(id);
let team=Number(localStorage.getItem("mnAnaTeam")||0);
let state=null;

onValue(ref(db,"mn_ana"),snap=>{
  el("connection").textContent="متصل";
  state=snap.val();
  render();
},err=>{el("connection").textContent="تعذر الاتصال";console.error(err)});

window.chooseTeam=n=>{
  team=Number(n);
  localStorage.setItem("mnAnaTeam",String(team));
  render();
};

function teamData(n){return state?.teams?.[n]||state?.teams?.[String(n)]||{}}

function render(){
  const t1=teamData(1),t2=teamData(2);
  el("pick1").textContent=t1.name||"الفريق الأول";
  el("pick2").textContent=t2.name||"الفريق الثاني";
  el("pick1").classList.toggle("active",team===1);
  el("pick2").classList.toggle("active",team===2);
  el("buzz").classList.remove("win","lose");
  el("x2").classList.remove("active");

  if(!team){
    el("status").textContent="اختر فريقك أولًا";
    el("buzz").disabled=true;
    el("x2").disabled=true;
    return;
  }

  const me=teamData(team);
  if(me.x2Active){
    el("x2").textContent="x2 مفعّل ✓";
    el("x2").classList.add("active");
    el("x2").disabled=true;
    el("x2hint").textContent="النقاط الإيجابية القادمة لهذا الفريق ستتضاعف.";
  }else if(me.x2Used){
    el("x2").textContent="تم استخدام x2";
    el("x2").disabled=true;
    el("x2hint").textContent="انتهت فرصة المضاعفة لهذا الفريق.";
  }else{
    el("x2").textContent="مضاعفة النقاط x2";
    el("x2").disabled=false;
    el("x2hint").textContent="لكل فريق استخدام واحد فقط طوال اللعبة.";
  }

  const bz=state?.buzzer||{};
  if(bz.winner){
    const wt=teamData(Number(bz.winner));
    if(Number(bz.winner)===team){
      el("status").textContent="أنت الأسرع! جاوب الآن";
      el("buzz").classList.add("win");
    }else{
      el("status").textContent="سبقك "+(wt.name||"الفريق الآخر");
      el("buzz").classList.add("lose");
    }
    el("buzz").disabled=true;
    return;
  }

  if(!bz.open){
    el("status").textContent="الجرس مغلق — انتظر المقدم";
    el("buzz").disabled=true;
    return;
  }

  el("status").textContent="الجرس مفتوح!";
  el("buzz").disabled=false;
}

window.buzzNow=async()=>{
  if(!team||!state?.buzzer?.open)return;
  el("buzz").disabled=true;
  const result=await runTransaction(ref(db,"mn_ana/buzzer"),current=>{
    if(!current?.open||current?.winner)return;
    return {open:false,winner:team,pressedAt:Date.now()};
  });
  if(!result.committed)render();
};

window.activateX2=async()=>{
  if(!team)return;
  const result=await runTransaction(ref(db,`mn_ana/teams/${team}`),current=>{
    if(!current||current.x2Used||current.x2Active)return;
    current.x2Active=true;
    current.x2Used=true;
    current.x2ActivatedAt=Date.now();
    return current;
  });
  if(!result.committed) render();
};
</script>
</body>
</html>
