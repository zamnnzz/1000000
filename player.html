<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>جرس الفريق</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
  <style>@font-face{font-family:"AA Galaxy";src:url("https://raw.githubusercontent.com/zamnnzz/fonts/main/hroffont-B6Zk_0ya.woff2") format("woff2");font-display:swap}</style>

  <style>
    :root{--bg:#633f8a;--panel:rgba(255,255,255,.09);--line:rgba(255,255,255,.18);--text:#fff;--muted:rgba(255,255,255,.72);--yellow:#ffd43b;--team1:#8b5cf5;--team2:#f97317;--vh:100dvh}
    *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden}
    body{font-family:"AA Galaxy",Cairo,sans-serif;color:var(--text);background:radial-gradient(circle at 50% -10%,rgba(255,255,255,.18),transparent 35%),linear-gradient(145deg,#4b286f,var(--bg) 55%,#42235f);display:grid;place-items:center;padding:clamp(8px,2vmin,20px)}
    button,input{font-family:inherit}.wrap{width:min(94vw,520px);height:min(calc(var(--vh) - 16px),900px);display:flex;flex-direction:column;gap:clamp(8px,1.5vmin,16px);transform:scale(var(--page-scale,1));transform-origin:center center}
    .card{background:linear-gradient(145deg,rgba(255,255,255,.13),rgba(255,255,255,.055));border:1px solid var(--line);border-radius:clamp(20px,4vmin,34px);box-shadow:0 22px 60px rgba(20,6,35,.3),inset 0 1px rgba(255,255,255,.12);backdrop-filter:blur(12px)}
    .hero{position:relative;text-align:center;padding:clamp(10px,2vmin,18px);overflow:hidden;flex:0 0 auto}.hero:after{content:"";position:absolute;inset:auto 12% -55px;height:70px;background:rgba(255,212,59,.22);filter:blur(35px)}
    .brand{display:flex;align-items:baseline;justify-content:center;gap:8px;line-height:1}.hero .title1{font-size:clamp(31px,7vmin,50px);font-weight:900;color:var(--yellow);text-shadow:0 5px rgba(0,0,0,.2)}.hero .title2{font-size:clamp(24px,5.5vmin,39px);font-weight:900;color:#fff}.hero .title3{font-size:clamp(18px,4vmin,29px);font-weight:900;color:#fff;margin-top:3px}.hero .subtitle{margin-top:5px;font-size:clamp(13px,2.6vmin,18px);color:var(--yellow)}.hero .desc{display:none}.session-pill{display:inline-block;margin-top:6px;padding:5px 13px;border-radius:99px;background:rgba(0,0,0,.14);border:1px solid rgba(255,255,255,.13);font-size:clamp(10px,2vmin,13px);color:var(--muted)}
    #setupScreen{padding:clamp(13px,2.5vmin,22px);flex:1;min-height:0;overflow:auto;scrollbar-width:none}#setupScreen::-webkit-scrollbar{display:none}.bell-icon{width:clamp(46px,8vmin,66px);height:clamp(46px,8vmin,66px);margin:0 auto clamp(8px,1.5vmin,14px);border-radius:20px;display:grid;place-items:center;background:rgba(255,212,59,.13);border:1px solid rgba(255,212,59,.28);font-size:clamp(22px,4vmin,31px);box-shadow:0 10px 30px rgba(0,0,0,.14)}
    .label{font-size:clamp(12px,2.3vmin,15px);font-weight:900;margin:0 3px 6px}.input{width:100%;border:1px solid rgba(255,255,255,.13);outline:none;border-radius:16px;padding:clamp(11px,2vmin,15px);background:rgba(28,12,47,.28);color:#fff;font-size:clamp(14px,2.7vmin,18px);margin-bottom:clamp(10px,1.8vmin,16px)}.input:focus{border-color:rgba(255,212,59,.65);box-shadow:0 0 0 3px rgba(255,212,59,.08)}.input::placeholder{color:rgba(255,255,255,.45)}
    .team-option{border-radius:18px;padding:clamp(11px,2vmin,16px);margin-bottom:9px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.055);cursor:pointer;position:relative;transition:.18s}.team-option.active{border-color:rgba(255,255,255,.42);background:rgba(255,255,255,.12);transform:translateY(-1px)}.team-dot{position:absolute;top:50%;left:15px;transform:translateY(-50%);width:16px;height:16px;border-radius:50%;box-shadow:0 0 0 5px rgba(255,255,255,.07)}.team-title{font-size:clamp(15px,2.8vmin,19px);font-weight:900}.team-sub{font-size:clamp(10px,2vmin,13px);color:var(--muted)}
    .save-btn{width:100%;border:0;border-radius:17px;padding:clamp(11px,2vmin,15px);margin-top:3px;font-size:clamp(16px,3vmin,20px);font-weight:900;cursor:pointer;background:linear-gradient(180deg,#fff,#eee8f6);color:#59377d;box-shadow:0 7px 0 rgba(29,12,45,.32)}.save-btn:active{transform:translateY(3px);box-shadow:0 4px 0 rgba(29,12,45,.32)}
    .hidden{display:none!important}
    .buzz-card{position:relative;flex:1;min-height:0;text-align:center;padding:clamp(14px,3vmin,28px);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}.buzz-card:before{content:"";position:absolute;width:min(70vw,340px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,212,59,.11),transparent 68%);pointer-events:none}.top-mini,.player-badge,.buzz-btn,.status,.change-btn{position:relative;z-index:1}.top-mini{margin-bottom:clamp(7px,1.5vmin,14px)}.top-mini .host{font-size:clamp(24px,5vmin,36px);font-weight:900;color:var(--yellow);text-shadow:0 5px rgba(0,0,0,.2)}.top-mini .meta{margin-top:2px;color:var(--muted);font-size:clamp(11px,2vmin,14px)}
    .player-badge{margin-bottom:clamp(8px,1.5vmin,14px);padding:7px 15px;border-radius:99px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);font-size:clamp(12px,2.3vmin,15px)}
    .buzz-btn{width:min(46vmin,230px);height:min(46vmin,230px);min-width:120px;min-height:120px;border-radius:50%;border:clamp(5px,1vmin,9px) solid rgba(255,255,255,.16);cursor:pointer;font-size:clamp(19px,4.2vmin,29px);font-weight:900;color:#fff;background:radial-gradient(circle at 38% 28%,#ff8185,#ef4d56 45%,#c72f3a 100%);box-shadow:0 0 0 9px rgba(255,255,255,.045),0 13px 0 #982631,0 24px 45px rgba(24,6,35,.38);margin:clamp(5px,1vmin,10px) auto clamp(12px,2vmin,18px);transition:.12s}.buzz-btn:active{transform:translateY(6px);box-shadow:0 0 0 9px rgba(255,255,255,.045),0 7px 0 #982631,0 15px 30px rgba(24,6,35,.35)}.buzz-btn:disabled{filter:saturate(.25);opacity:.72;cursor:not-allowed}.status{min-height:26px;font-size:clamp(13px,2.6vmin,18px);font-weight:900}.change-btn{margin-top:clamp(8px,1.5vmin,14px);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);color:#fff;border-radius:14px;padding:8px 13px;font-size:clamp(11px,2vmin,14px);cursor:pointer}
    @media (orientation:landscape) and (max-height:560px){.wrap{width:min(94vw,760px);height:calc(var(--vh) - 12px);display:grid;grid-template-columns:minmax(180px,.62fr) minmax(300px,1.38fr);grid-template-rows:1fr;gap:10px}.hero{display:flex;flex-direction:column;justify-content:center}.brand{flex-wrap:wrap}.hero .title1{font-size:clamp(27px,7vh,42px)}.hero .title2{font-size:clamp(22px,6vh,34px)}.hero .title3{font-size:clamp(18px,5vh,27px)}#setupScreen,.buzz-card{height:100%;}.bell-icon{display:none}.buzz-btn{width:min(42vh,200px);height:min(42vh,200px);min-width:110px;min-height:110px}.team-option{padding:9px 13px}.input{padding:10px 13px;margin-bottom:9px}.save-btn{padding:10px}.top-mini{margin-bottom:4px}.player-badge{margin-bottom:4px}.change-btn{margin-top:7px}}
  </style>
</head>
<body>
  <div class="wrap">

    <div class="card hero">
      <div class="title1">حروف</div>
      <div class="title2">مع</div>
      <div class="title3" id="hostNameTop">المقدم</div>

      <div class="subtitle">جرس الفريق</div>
      <div class="desc">ادخل اسمك، اختر فريقك، ثم احفظ للدخول إلى صفحة الزر</div>
      <div class="session-pill" id="sessionBox">جلسة ...</div>
    </div>

    <!-- شاشة الدخول -->
    <div class="card" id="setupScreen">
      <div class="bell-icon">🔔</div>

      <div class="label">اسم اللاعب</div>
      <input id="playerName" class="input" type="text" placeholder="اكتب اسمك هنا" maxlength="20">

      <div class="label">اختر الفريق</div>

      <div class="team-option active" data-team="c1" onclick="selectTeam('c1', this)">
        <div class="team-dot" style="background:var(--team1)"></div>
        <div class="team-title" id="team1CardName">الفريق الأول</div>
        <div class="team-sub">فريق 1</div>
      </div>

      <div class="team-option" data-team="c2" onclick="selectTeam('c2', this)">
        <div class="team-dot" style="background:var(--team2)"></div>
        <div class="team-title" id="team2CardName">الفريق الثاني</div>
        <div class="team-sub">فريق 2</div>
      </div>

      <button class="save-btn" onclick="savePlayerData()">حفظ</button>
    </div>

    <!-- شاشة الزر -->
    <div class="card buzz-card hidden" id="buzzScreen">
      <div class="top-mini">
        <div class="host" id="hostNameBuzz">المقدم</div>
        <div class="meta">جرس الفريق</div>
      </div>

      <div class="player-badge" id="playerSummary">اللاعب / الفريق</div>

      <button id="buzzBtn" class="buzz-btn" onclick="pressBuzzer()">اضغط الآن!</button>

      <div class="status" id="statusMsg">⏳ انتظر فتح الجرس...</div>

      <button class="change-btn" onclick="backToSetup()">تعديل الاسم أو الفريق</button>
    </div>

  </div>

  <script>
    (function(){
      function fitPlayerPage(){
        const vv=window.visualViewport;
        const h=vv?vv.height:window.innerHeight;
        document.documentElement.style.setProperty('--vh',h+'px');
        const wrap=document.querySelector('.wrap');
        if(!wrap)return;
        wrap.style.setProperty('--page-scale','1');
        requestAnimationFrame(()=>{
          const r=wrap.getBoundingClientRect();
          const aw=(vv?vv.width:window.innerWidth)-12, ah=h-12;
          const scale=Math.min(1,aw/r.width,ah/r.height);
          wrap.style.setProperty('--page-scale',String(Math.max(.55,scale)));
        });
      }
      addEventListener('resize',fitPlayerPage);addEventListener('orientationchange',fitPlayerPage);
      if(window.visualViewport){visualViewport.addEventListener('resize',fitPlayerPage);visualViewport.addEventListener('scroll',fitPlayerPage)}
      addEventListener('DOMContentLoaded',fitPlayerPage);
    })();
  </script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCgwvqKj2BQ4nepbUk1gJ9Yb4o3hJWUwOs",
      authDomain: "horof-game-9934e.firebaseapp.com",
      databaseURL: "https://horof-game-9934e-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "horof-game-9934e",
      appId: "1:44896634225:web:62a672d8c94be6e0d762d0"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const urlParams = new URLSearchParams(window.location.search);
    const session = urlParams.get("session") || "default";

    let selectedTeam = "c1";
    let playerData = {
      name: "",
      team: "c1"
    };

    document.getElementById("sessionBox").innerText = "جلسة " + session.toUpperCase();

    function selectTeam(team, el){
      selectedTeam = team;
      document.querySelectorAll(".team-option").forEach(card => card.classList.remove("active"));
      el.classList.add("active");
    }

    function savePlayerData(){
      const name = document.getElementById("playerName").value.trim();

      if(!name){
        alert("اكتب اسمك أولاً");
        return;
      }

      playerData.name = name;
      playerData.team = selectedTeam;

      localStorage.setItem("horofPlayer_" + session, JSON.stringify(playerData));

      document.getElementById("setupScreen").classList.add("hidden");
      document.getElementById("buzzScreen").classList.remove("hidden");

      updatePlayerSummary();
    }

    function backToSetup(){
      document.getElementById("buzzScreen").classList.add("hidden");
      document.getElementById("setupScreen").classList.remove("hidden");
    }

    function updatePlayerSummary(){
      const teamName =
        playerData.team === "c1"
          ? document.getElementById("team1CardName").innerText
          : document.getElementById("team2CardName").innerText;

     document.getElementById("playerSummary").innerText =
"👤 " + playerData.name + " |  " + teamName;
    }

    function loadSavedPlayer(){
      const saved = localStorage.getItem("horofPlayer_" + session);
      if(!saved) return;

      try{
        const data = JSON.parse(saved);
        if(data && data.name && data.team){
          playerData = data;
          selectedTeam = data.team;
          document.getElementById("playerName").value = data.name;

          const teamCard = document.querySelector('.team-option[data-team="' + data.team + '"]');
          if(teamCard){
            document.querySelectorAll(".team-option").forEach(card => card.classList.remove("active"));
            teamCard.classList.add("active");
          }

          document.getElementById("setupScreen").classList.add("hidden");
          document.getElementById("buzzScreen").classList.remove("hidden");
          updatePlayerSummary();
        }
      }catch(e){}
    }

    function pressBuzzer(){
      if(!playerData.name){
        alert("احفظ بياناتك أولاً");
        return;
      }

      const btn = document.getElementById("buzzBtn");
      const status = document.getElementById("statusMsg");

      const buzzerRef = db.ref("games/" + session + "/buzzer");

      buzzerRef.transaction(current => {
        if(current === null){
          return {
            name: playerData.name,
            team: playerData.team,
            time: Date.now()
          };
        }
        return;
      }).then(result => {
        if(result.committed){
          btn.disabled = true;
          btn.innerText = "تم الإرسال!";
          status.innerText = "✅ وصل اسمك للمقدم";
          status.style.color = "#7CFFB2";
          if(navigator.vibrate) navigator.vibrate(150);
        }else{
          status.innerText = "⌛ سبقك لاعب آخر";
          status.style.color = "#FFD166";
        }
      });
    }

    function applyHostData(data){
      const hostName = (data && data.hostName) ? data.hostName : "المقدم";
      const team1 = (data && data.teamNames && data.teamNames.c1) ? data.teamNames.c1 : "الفريق الأول";
      const team2 = (data && data.teamNames && data.teamNames.c2) ? data.teamNames.c2 : "الفريق الثاني";
      const team1Color = (data && data.teamColors && data.teamColors.c1) ? data.teamColors.c1 : "#e67e22";
      const team2Color = (data && data.teamColors && data.teamColors.c2) ? data.teamColors.c2 : "#7b61ff";


document.getElementById("hostNameTop").innerText = hostName;
document.getElementById("hostNameBuzz").innerText = hostName;

document.getElementById("team1CardName").innerText = team1;
document.getElementById("team2CardName").innerText = team2;

      document.documentElement.style.setProperty("--team1", team1Color);
      document.documentElement.style.setProperty("--team2", team2Color);

      updatePlayerSummary();
    }

    db.ref("games/" + session + "/settings").on("value", snap => {
      applyHostData(snap.val());
    });

    db.ref("games/" + session + "/status").on("value", snap => {
      const data = snap.val();
      const btn = document.getElementById("buzzBtn");
      const status = document.getElementById("statusMsg");

    if(!data){
  btn.disabled = false;
  btn.innerText = "اضغط الآن!";
  status.innerText = "🚀 الجرس مفتوح";
  status.style.color = "#7CFFB2";
  return;
}

      if(data.locked === false){
        btn.disabled = false;
        btn.innerText = "اضغط الآن!";
        status.innerText = "🚀 الجرس مفتوح";
        status.style.color = "#7CFFB2";
      }else{
        btn.disabled = true;
        btn.innerText = "مغلق";
        status.innerText = "⏳ انتظر فتح الجرس...";
        status.style.color = "#ffffff";
      }
    });

    loadSavedPlayer();
  </script>
</body>
</html
