<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>جرس الفريق</title>
  <style>
    @font-face{
      font-family:"AA Galaxy";
      src:url("https://raw.githubusercontent.com/zamnnzz/fonts/main/hroffont-B6Zk_0ya.woff2") format("woff2");
      font-weight:normal;font-style:normal;font-display:swap;
    }
    :root{
      --bg:#633f8a;
      --panel:rgba(255,255,255,.095);
      --line:rgba(255,255,255,.18);
      --text:#fff;
      --muted:rgba(255,255,255,.72);
      --gold:#ffd400;
      --team1:#8b5cf5;
      --team2:#f97317;
      --vvh:100dvh;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:"AA Galaxy",sans-serif}
    button,input{font:inherit}
    body{min-height:100dvh;background:
      radial-gradient(circle at 50% -10%,rgba(255,255,255,.16),transparent 38%),
      linear-gradient(145deg,#4d2c70 0%,var(--bg) 50%,#3f235f 100%)}
    .screen{position:fixed;inset:0;width:100%;height:var(--vvh);padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:grid;place-items:center;overflow:auto}
    .hidden{display:none!important}

    /* شاشة الدخول */
    .setup-shell{width:min(92vw,460px);max-height:calc(var(--vvh) - 28px);display:flex;flex-direction:column;gap:clamp(12px,2vh,20px)}
    .brand{text-align:center;flex:none;line-height:.9;text-shadow:0 5px 0 rgba(0,0,0,.2)}
    .brand .h{font-size:clamp(46px,12vw,72px);color:var(--gold)}
    .brand .with{font-size:clamp(28px,7vw,42px);color:#74ddd3;margin-top:-5px}
    .brand .host{font-size:clamp(24px,6vw,36px);color:#ff6c72;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .setup-card{background:linear-gradient(180deg,rgba(255,255,255,.11),rgba(255,255,255,.065));border:1px solid var(--line);border-radius:28px;padding:clamp(17px,4vw,25px);box-shadow:0 20px 55px rgba(0,0,0,.24);backdrop-filter:blur(10px)}
    .setup-title{text-align:center;font-size:clamp(19px,5vw,25px);margin:0 0 16px}
    .label{font-size:16px;margin:0 4px 8px;color:rgba(255,255,255,.92)}
    .input{width:100%;height:56px;border:1px solid rgba(255,255,255,.16);outline:none;border-radius:17px;padding:0 16px;background:rgba(32,15,50,.35);color:#fff;font-size:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
    .input:focus{border-color:rgba(255,255,255,.42);box-shadow:0 0 0 3px rgba(255,255,255,.07)}
    .input::placeholder{color:rgba(255,255,255,.48)}
    .teams-label{margin-top:16px}
    .teams{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .team-option{min-height:70px;border-radius:18px;padding:12px 10px;border:2px solid transparent;background:rgba(255,255,255,.075);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;text-align:center;transition:.16s ease;position:relative;overflow:hidden}
    .team-option::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--dot);box-shadow:0 0 0 5px color-mix(in srgb,var(--dot) 20%,transparent)}
    .team-option.active{border-color:var(--dot);background:color-mix(in srgb,var(--dot) 14%,rgba(255,255,255,.06));transform:translateY(-1px)}
    .team-title{font-size:clamp(15px,4vw,18px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
    .save-btn{width:100%;height:58px;margin-top:17px;border:0;border-radius:18px;background:#fff;color:#583578;font-size:20px;cursor:pointer;box-shadow:0 7px 0 rgba(28,11,43,.35);transition:.12s ease}
    .save-btn:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(28,11,43,.35)}
    .session{margin-top:11px;text-align:center;color:var(--muted);font-size:13px}

    /* شاشة الجرس */
    .buzz-shell{width:min(94vw,560px);height:min(calc(var(--vvh) - 28px),760px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:clamp(10px,2vh,18px)}
    .buzz-brand{flex:none;line-height:.95;text-shadow:0 4px 0 rgba(0,0,0,.2)}
    .buzz-brand .h{font-size:clamp(38px,10vw,60px);color:var(--gold)}
    .buzz-brand .withline{font-size:clamp(22px,5.5vw,32px);color:#76ddd5;margin-top:2px}
    .buzz-brand .host{display:inline-block;color:#ff6c72;max-width:70vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}
    .player-line{font-size:clamp(15px,4vw,19px);color:rgba(255,255,255,.9);padding:9px 15px;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.07);border-radius:999px;max-width:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .buzzer-stage{position:relative;width:clamp(190px,min(60vw,45vh),300px);aspect-ratio:1;display:grid;place-items:center;isolation:isolate;flex:none}
    .buzzer-stage::before{content:"";position:absolute;inset:5%;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.12),rgba(255,255,255,.03) 58%,transparent 70%);filter:blur(2px);z-index:-2}
    .buzz-btn{position:relative;width:78%;aspect-ratio:1;border-radius:50%;border:clamp(7px,1.6vw,11px) solid rgba(255,255,255,.9);cursor:pointer;color:#fff;background:radial-gradient(circle at 40% 28%,#ff7b80 0 12%,#f04f59 35%,#ce3340 72%,#a52531 100%);box-shadow:0 15px 0 #8e2029,0 24px 42px rgba(0,0,0,.36),inset 0 5px 12px rgba(255,255,255,.24);display:grid;place-items:center;transition:transform .12s,box-shadow .12s;z-index:2}
    .buzz-btn span{font-size:clamp(25px,6vw,38px);line-height:1.1;text-shadow:0 3px 0 rgba(0,0,0,.2)}
    .buzz-btn:active:not(:disabled){transform:translateY(7px);box-shadow:0 8px 0 #8e2029,0 15px 28px rgba(0,0,0,.32),inset 0 5px 12px rgba(255,255,255,.2)}
    .buzz-btn:disabled{cursor:not-allowed;filter:saturate(.15) brightness(.82)}
    .rays{position:absolute;inset:-9%;border-radius:50%;opacity:0;pointer-events:none;z-index:1;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,0) 0deg 9deg,rgba(255,255,255,.95) 10deg 12deg,rgba(255,255,255,0) 13deg 24deg);-webkit-mask:radial-gradient(circle,transparent 0 51%,#000 53% 69%,transparent 72%);mask:radial-gradient(circle,transparent 0 51%,#000 53% 69%,transparent 72%);filter:drop-shadow(0 0 10px #fff)}
    .buzzer-stage.winner .rays{animation:rayBurst .85s ease-out both}
    .buzzer-stage.winner::after{content:"";position:absolute;inset:18%;border-radius:50%;border:4px solid rgba(255,255,255,.95);animation:whiteRing .75s ease-out both;z-index:3;pointer-events:none}
    @keyframes rayBurst{0%{opacity:0;transform:scale(.65) rotate(0)}20%{opacity:1}100%{opacity:0;transform:scale(1.3) rotate(10deg)}}
    @keyframes whiteRing{0%{opacity:1;transform:scale(.7)}100%{opacity:0;transform:scale(1.6)}}
    .status{min-height:28px;font-size:clamp(16px,4vw,20px);color:#fff}
    .change-btn{border:0;background:transparent;color:rgba(255,255,255,.72);font-size:14px;text-decoration:underline;cursor:pointer;padding:8px}

    @media (max-height:620px) and (orientation:landscape){
      .setup-shell{width:min(88vw,760px);display:grid;grid-template-columns:.75fr 1.25fr;align-items:center;gap:22px}.brand{padding-inline:10px}.setup-card{padding:15px 18px}.setup-title{margin-bottom:10px}.input{height:48px}.teams-label{margin-top:10px}.team-option{min-height:55px}.save-btn{height:50px;margin-top:10px}.session{display:none}
      .buzz-shell{width:min(92vw,900px);height:calc(var(--vvh) - 18px);display:grid;grid-template-columns:.75fr 1.25fr;grid-template-rows:auto auto;column-gap:20px}.buzz-brand{grid-column:1;grid-row:1}.player-line{grid-column:1;grid-row:2;align-self:start}.buzzer-stage{grid-column:2;grid-row:1 / span 2;width:clamp(190px,min(48vh,33vw),290px);justify-self:center}.status{position:absolute;bottom:max(8px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);white-space:nowrap}.change-btn{position:absolute;top:max(7px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left))}
    }


    /* ===== التوب 27-2: توزيع عناصر صفحة الجرس على كامل المساحة + شعار اللعبة الأصلي ===== */
    #setupScreen,#buzzScreen{
      overflow:hidden;
      place-items:stretch;
    }

    /* نفس منطق وترتيب شعار واجهة اللعبة: حروف ثم «مع» متداخلة يساراً ثم اسم المقدم */
    .brand,.buzz-brand{
      position:relative;
      width:min(92vw,520px);
      margin-inline:auto;
      text-align:center;
      line-height:1;
      text-shadow:none;
      flex:none;
    }
    .brand .h,.buzz-brand .h{
      font-size:clamp(62px,min(17vw,16vh),110px);
      font-weight:900;
      color:#FFD400;
      text-shadow:0 .055em 0 #3b2563,0 .075em 0 #2b1b49,0 .09em .11em rgba(0,0,0,.4);
      margin:0;
      line-height:.88;
    }
    .brand .with,.buzz-brand .withline{
      display:block;
      width:max-content;
      margin:-.08em auto 0;
      font-size:clamp(32px,min(8.5vw,8vh),55px);
      font-weight:900;
      color:#63d6c7;
      text-shadow:0 .11em 0 #2e7f79,0 .145em 0 #1d5e59,0 .18em .21em rgba(0,0,0,.4);
      transform:translateX(-1.27em);
      line-height:.95;
    }
    .brand .host,.buzz-brand .host{
      display:block;
      width:min(90vw,520px);
      max-width:none;
      margin:-.03em auto 0;
      font-size:clamp(48px,min(14.7vw,13.8vh),95px);
      font-weight:900;
      color:#ff5a4f;
      text-shadow:0 .063em 0 #7a2323,0 .084em 0 #4b1515,0 .105em .126em rgba(0,0,0,.5);
      transform:translateX(-.105em);
      line-height:.9;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .buzz-brand .withline .host{ /* إلغاء تنسيق span القديم؛ اسم المقدم يصبح سطراً مستقلاً مثل اللعبة */
      margin-top:.04em;
    }

    /* شاشة الدخول: تستفيد من كامل الارتفاع المتاح وتوزع الشعار والبطاقة داخله */
    .setup-shell{
      width:100%;
      max-width:none;
      height:100%;
      max-height:none;
      display:grid;
      grid-template-rows:minmax(0,44fr) minmax(0,56fr);
      align-items:center;
      justify-items:center;
      gap:clamp(8px,1.6vh,18px);
      padding:0;
    }
    .setup-shell .brand{align-self:end}
    .setup-card{
      width:min(92vw,520px);
      max-height:100%;
      align-self:start;
      overflow:hidden;
      padding:clamp(14px,2.4vh,25px) clamp(17px,4vw,25px);
    }
    .setup-title{font-size:clamp(18px,2.8vh,25px);margin-bottom:clamp(8px,1.8vh,16px)}
    .label{font-size:clamp(13px,2.1vh,16px);margin-bottom:clamp(5px,.9vh,8px)}
    .input{height:clamp(44px,7vh,56px);font-size:clamp(15px,2.4vh,18px)}
    .teams-label{margin-top:clamp(8px,1.7vh,16px)}
    .team-option{min-height:clamp(50px,8.5vh,70px);padding:clamp(8px,1.5vh,12px) 10px}
    .save-btn{height:clamp(46px,7.4vh,58px);margin-top:clamp(9px,1.8vh,17px);font-size:clamp(17px,2.6vh,20px)}
    .session{margin-top:clamp(5px,1.2vh,11px);font-size:clamp(10px,1.7vh,13px)}

    /* شاشة الجرس: كامل المساحة موزعة بين الشعار والبيانات والجرس والحالة */
    .buzz-shell{
      width:100%;
      max-width:none;
      height:100%;
      max-height:none;
      display:grid;
      grid-template-rows:minmax(0,30fr) auto minmax(0,54fr) auto auto;
      align-items:center;
      justify-items:center;
      gap:clamp(5px,1.15vh,12px);
      padding:0;
    }
    .buzz-shell .buzz-brand{align-self:end}
    .player-line{max-width:min(88vw,560px);font-size:clamp(14px,2.2vh,19px);padding:clamp(6px,1.1vh,9px) 15px}
    .buzzer-stage{
      width:min(76vw,46vh,340px);
      max-width:100%;
      max-height:100%;
    }
    .status{min-height:0;font-size:clamp(14px,2.2vh,20px)}
    .change-btn{font-size:clamp(12px,1.8vh,14px);padding:clamp(4px,.8vh,8px)}

    /* الوضع العرضي: نستغل العرض كاملاً بدلاً من ضغط العناصر فوق بعض */
    @media (orientation:landscape){
      .setup-shell{
        grid-template-columns:minmax(0,44fr) minmax(0,56fr);
        grid-template-rows:1fr;
        gap:clamp(12px,3vw,38px);
      }
      .setup-shell .brand{align-self:center;justify-self:end;width:min(42vw,500px)}
      .setup-card{align-self:center;justify-self:start;width:min(48vw,520px)}
      .brand .h,.buzz-brand .h{font-size:clamp(52px,min(9.7vw,18vh),110px)}
      .brand .with,.buzz-brand .withline{font-size:clamp(27px,min(4.9vw,9vh),55px)}
      .brand .host,.buzz-brand .host{font-size:clamp(44px,min(8.4vw,15.5vh),95px);width:min(44vw,520px)}

      .buzz-shell{
        grid-template-columns:minmax(0,42fr) minmax(0,58fr);
        grid-template-rows:minmax(0,1fr) auto auto;
        column-gap:clamp(12px,3vw,38px);
        row-gap:clamp(4px,1vh,10px);
      }
      .buzz-shell .buzz-brand{grid-column:1;grid-row:1;align-self:center;justify-self:end;width:min(40vw,500px)}
      .player-line{grid-column:1;grid-row:2;justify-self:end;max-width:40vw}
      .buzzer-stage{grid-column:2;grid-row:1 / span 2;width:min(50vw,72vh,390px);justify-self:center;align-self:center}
      .status{grid-column:2;grid-row:3;position:static;transform:none;white-space:normal}
      .change-btn{grid-column:1;grid-row:3;position:static;justify-self:end}
    }

  </style>
</head>
<body>
  <section class="screen" id="setupScreen">
    <div class="setup-shell">
      <div class="brand">
        <div class="h">حروف</div>
        <div class="with">مـع</div>
        <div class="host" id="hostNameTop">المقدم</div>
      </div>
      <div class="setup-card">
        <h1 class="setup-title">دخول الجرس</h1>
        <div class="label">اسم اللاعب</div>
        <input id="playerName" class="input" type="text" placeholder="اكتب اسمك هنا" maxlength="20" autocomplete="name">
        <div class="label teams-label">اختر فريقك</div>
        <div class="teams">
          <button type="button" class="team-option active" data-team="c1" style="--dot:var(--team1)" onclick="selectTeam('c1',this)"><span class="team-title" id="team1CardName">الفريق الأول</span></button>
          <button type="button" class="team-option" data-team="c2" style="--dot:var(--team2)" onclick="selectTeam('c2',this)"><span class="team-title" id="team2CardName">الفريق الثاني</span></button>
        </div>
        <button class="save-btn" onclick="savePlayerData()">دخول</button>
        <div class="session" id="sessionBox">جلسة ...</div>
      </div>
    </div>
  </section>

  <section class="screen hidden" id="buzzScreen">
    <div class="buzz-shell">
      <div class="buzz-brand">
        <div class="h">حروف</div>
        <div class="withline">مـع</div>
        <div class="host" id="hostNameBuzz">المقدم</div>
      </div>
      <div class="player-line" id="playerSummary">اللاعب / الفريق</div>
      <div class="buzzer-stage" id="buzzerStage">
        <div class="rays"></div>
        <button id="buzzBtn" class="buzz-btn" onclick="pressBuzzer()"><span>اضغط</span></button>
      </div>
      <div class="status" id="statusMsg">انتظر فتح الجرس...</div>
      <button class="change-btn" onclick="backToSetup()">تعديل الاسم أو الفريق</button>
    </div>
  </section>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script>
    const firebaseConfig={apiKey:"AIzaSyCgwvqKj2BQ4nepbUk1gJ9Yb4o3hJWUwOs",authDomain:"horof-game-9934e.firebaseapp.com",databaseURL:"https://horof-game-9934e-default-rtdb.europe-west1.firebasedatabase.app",projectId:"horof-game-9934e",appId:"1:44896634225:web:62a672d8c94be6e0d762d0"};
    firebase.initializeApp(firebaseConfig); const db=firebase.database();
    const urlParams=new URLSearchParams(window.location.search); const session=urlParams.get("session")||"default";
    let selectedTeam="c1"; let playerData={name:"",team:"c1"};
    document.getElementById("sessionBox").innerText="جلسة "+session.toUpperCase();

    function syncViewport(){const h=window.visualViewport?window.visualViewport.height:window.innerHeight;document.documentElement.style.setProperty('--vvh',Math.round(h)+'px')}
    syncViewport(); addEventListener('resize',syncViewport); if(window.visualViewport){visualViewport.addEventListener('resize',syncViewport);visualViewport.addEventListener('scroll',syncViewport)}

    function selectTeam(team,el){selectedTeam=team;document.querySelectorAll('.team-option').forEach(x=>x.classList.remove('active'));el.classList.add('active')}
    function savePlayerData(){const name=document.getElementById('playerName').value.trim();if(!name){alert('اكتب اسمك أولاً');return}playerData.name=name;playerData.team=selectedTeam;localStorage.setItem('horofPlayer_'+session,JSON.stringify(playerData));document.getElementById('setupScreen').classList.add('hidden');document.getElementById('buzzScreen').classList.remove('hidden');updatePlayerSummary()}
    function backToSetup(){document.getElementById('buzzScreen').classList.add('hidden');document.getElementById('setupScreen').classList.remove('hidden')}
    function updatePlayerSummary(){const t=playerData.team==='c1'?document.getElementById('team1CardName').innerText:document.getElementById('team2CardName').innerText;document.getElementById('playerSummary').innerText=playerData.name+' • '+t}
    function loadSavedPlayer(){const saved=localStorage.getItem('horofPlayer_'+session);if(!saved)return;try{const data=JSON.parse(saved);if(data&&data.name&&data.team){playerData=data;selectedTeam=data.team;document.getElementById('playerName').value=data.name;const card=document.querySelector('.team-option[data-team="'+data.team+'"]');if(card){document.querySelectorAll('.team-option').forEach(x=>x.classList.remove('active'));card.classList.add('active')}document.getElementById('setupScreen').classList.add('hidden');document.getElementById('buzzScreen').classList.remove('hidden');updatePlayerSummary()}}catch(e){}}

    function firstPressAnimation(){const s=document.getElementById('buzzerStage');s.classList.remove('winner');void s.offsetWidth;s.classList.add('winner');setTimeout(()=>s.classList.remove('winner'),950)}
    function pressBuzzer(){
      if(!playerData.name){alert('احفظ بياناتك أولاً');return}
      const btn=document.getElementById('buzzBtn'), status=document.getElementById('statusMsg');
      const buzzerRef=db.ref('games/'+session+'/buzzer');
      buzzerRef.transaction(current=>current===null?{name:playerData.name,team:playerData.team,time:Date.now()}:undefined).then(result=>{
        if(result.committed){firstPressAnimation();btn.disabled=true;btn.querySelector('span').innerText='الأول!';status.innerText='أنت الأسرع';status.style.color='#fff';if(navigator.vibrate)navigator.vibrate([80,45,140])}
        else{status.innerText='سبقك لاعب آخر';status.style.color='#FFD166'}
      });
    }

    function applyHostData(data){
      const hostName=data&&data.hostName?data.hostName:'المقدم';
      const team1=data&&data.teamNames&&data.teamNames.c1?data.teamNames.c1:'الفريق الأول';
      const team2=data&&data.teamNames&&data.teamNames.c2?data.teamNames.c2:'الفريق الثاني';
      const team1Color=data&&data.teamColors&&data.teamColors.c1?data.teamColors.c1:'#8b5cf5';
      const team2Color=data&&data.teamColors&&data.teamColors.c2?data.teamColors.c2:'#f97317';
      document.getElementById('hostNameTop').innerText=hostName;document.getElementById('hostNameBuzz').innerText=hostName;
      document.getElementById('team1CardName').innerText=team1;document.getElementById('team2CardName').innerText=team2;
      document.documentElement.style.setProperty('--team1',team1Color);document.documentElement.style.setProperty('--team2',team2Color);updatePlayerSummary();
    }
    db.ref('games/'+session+'/settings').on('value',snap=>applyHostData(snap.val()));
    db.ref('games/'+session+'/status').on('value',snap=>{
      const data=snap.val(),btn=document.getElementById('buzzBtn'),status=document.getElementById('statusMsg'),label=btn.querySelector('span');
      if(!data||data.locked===false){btn.disabled=false;label.innerText='اضغط';status.innerText='الجرس مفتوح';status.style.color='#7CFFB2'}
      else{btn.disabled=true;label.innerText='مغلق';status.innerText='انتظر فتح الجرس...';status.style.color='#fff'}
    });
    loadSavedPlayer();
  </script>
</body>
</html>
